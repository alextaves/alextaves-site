<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>knife exp</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0c0806;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    --h: 78vh;
    --w: calc(var(--h) * 3 / 4);
    height: var(--h);
    width: var(--w);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #CCAD00; /* school bus yellow, darkened 20% */
  }

  /* JS toggles this class at random intervals; CSS vars carry the randomized values */
  .card.glitching {
    filter: brightness(var(--glitch-brightness, 1));
  }
  .card.glitching .static-overlay {
    opacity: var(--glitch-static-opacity, 0.85);
    transform: translateX(var(--glitch-x, 0px)) skewX(var(--glitch-skew, 0deg));
  }

  /* black & white TV static — flickers between noise frames via JS below.
     mix-blend-mode:overlay (not screen) so the harsh B/W speckle darkens as much
     as it lightens, keeping the yellow's depth instead of washing it pale */
  .static-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.85;
    mix-blend-mode: overlay;
    image-rendering: pixelated;
    background-repeat: repeat;
    background-size: 4px 4px;
  }

  /* knife is always on top — pure black, untouched by the static beneath it */
  .card img {
    width: 86.4%;
    height: 86.4%;
    object-fit: contain;
    display: block;
    position: relative;
    z-index: 10;
    transform-origin: center center;
    animation: knifeSpin 15s linear infinite;
  }

  /* 3 slow counter-clockwise spins over the first 8s of a 15s cycle, then holds at a 40deg clockwise tilt */
  @keyframes knifeSpin {
    0%      { transform: rotate(40deg); }
    53.333% { transform: rotate(-1040deg); } /* 40deg - 3 full turns, counter-clockwise */
    100%    { transform: rotate(-1040deg); }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <img src="/knife_halftone.png" alt="">
  <div class="static-overlay" id="staticOverlay"></div>
</div>

<script>
(function () {
  var el = document.getElementById('staticOverlay')

  function svgFrame(seed) {
    var svg =
      "<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'>" +
      "<filter id='n'>" +
      "<feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='" + seed + "' stitchTiles='stitch' result='t'/>" +
      "<feColorMatrix in='t' type='saturate' values='0'/>" +
      "<feComponentTransfer>" +
      "<feFuncR type='discrete' tableValues='0 1'/>" +
      "<feFuncG type='discrete' tableValues='0 1'/>" +
      "<feFuncB type='discrete' tableValues='0 1'/>" +
      "</feComponentTransfer>" +
      "</filter>" +
      "<rect width='100%' height='100%' filter='url(#n)'/>" +
      "</svg>"
    return 'data:image/svg+xml,' + encodeURIComponent(svg)
  }

  // pre-generate a handful of distinct noise frames, then flicker between them —
  // a single static image never reads as real TV fuzz, it needs to actually change
  var frames = []
  for (var i = 0; i < 8; i++) frames.push(svgFrame(i * 37 + 1))

  var idx = 0
  function tick() {
    idx = (idx + 1) % frames.length
    el.style.backgroundImage = 'url("' + frames[idx] + '")'
    setTimeout(tick, 55 + Math.random() * 40)
  }
  tick()

  // ── random glitch bursts ──────────────────────────────────────────────────
  var card = document.getElementById('card')
  function rand(min, max) { return min + Math.random() * (max - min) }

  function fireGlitch() {
    var duration = rand(40, 160)
    var dim = Math.random() < 0.5
    card.style.setProperty('--glitch-brightness', dim ? rand(0.15, 0.4).toFixed(2) : rand(1.3, 1.8).toFixed(2))
    card.style.setProperty('--glitch-static-opacity', rand(0.5, 1).toFixed(2))
    card.style.setProperty('--glitch-x', rand(-14, 14).toFixed(1) + 'px')
    card.style.setProperty('--glitch-skew', rand(-4, 4).toFixed(1) + 'deg')
    card.classList.add('glitching')
    setTimeout(function () { card.classList.remove('glitching') }, duration)
  }

  function scheduleNext() {
    var delay = rand(500, 3600)
    setTimeout(function () {
      fireGlitch()
      if (Math.random() < 0.2) setTimeout(fireGlitch, rand(50, 120))
      scheduleNext()
    }, delay)
  }
  scheduleNext()
})()
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>alextaves</title>
<link href="/vendor/fonts/ibm-plex.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0c0806; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }

  .story-overlay {
    --bg: #D9D02F; --bg-r: 217; --bg-g: 208; --bg-b: 47;
    container-type: size;
    position: fixed; z-index: 50;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.035) 0px, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 3px),
      rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.9);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    opacity: 0; pointer-events: none;
    transition: opacity 400ms ease;
    overflow-y: auto; overflow-x: hidden;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow:
      0 0 90px 18px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.4),
      0 25px 80px rgba(0, 0, 0, 0.7);
  }
  .story-overlay.active {
    opacity: 1; pointer-events: auto;
    animation: storyGlow 5s ease-in-out infinite;
  }
  @keyframes storyGlow {
    0%, 100% { box-shadow: 0 0 90px 18px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.4), 0 25px 80px rgba(0, 0, 0, 0.7); }
    50%      { box-shadow: 0 0 130px 30px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.6), 0 25px 80px rgba(0, 0, 0, 0.7); }
  }
  .story-text {
    padding: 7% 8% 10%;
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    color: #000;
  }
  .story-text::after { content: ''; display: table; clear: both; }
  /* Same typed-title treatment used for the fiction ring's story cards —
     black ink, floated so the prose wraps around it like a headline. */
  .story-cover-title {
    float: left;
    width: 44%;
    margin: 0 1.6em 1em 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-size: 2.3em;
    line-height: 1.14;
    color: #000;
  }
  .story-cover-title .line { min-height: 1.14em; }
  .story-cover-title .line.cursor-on::after {
    content: '';
    display: inline-block;
    width: 0.06em; height: 0.85em;
    background: #000;
    margin-left: 0.05em;
    vertical-align: -0.08em;
  }
  .story-body p {
    letter-spacing: 0.01em;
    font-size: 1.05em; line-height: 1.85; margin: 0 0 1.2em;
  }
  .story-body .entry-date { font-weight: 700; }
  .story-body .typing::after {
    content: '▋'; color: #000; margin-left: 0.12em;
    animation: caretBlink 0.9s steps(1) infinite;
  }
  @keyframes caretBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* Enquiries — sized with container-query units so the heading lands at
     exactly the same scale and position as the plain card's own canvas
     texture (makePortalTex: 74px title baseline at 16.5% of height, 9%
     left margin, thin tracked sub at 23.75%) — the form reads as the same
     card continuing to unfold, not a differently-proportioned modal. */
  .enquiry-form {
    display: none;
    padding: 9.5cqh 9cqw 5cqh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #000;
  }
  .enquiry-form h1 {
    font-weight: 700; letter-spacing: -0.01em;
    font-size: 9.25cqh; line-height: 1;
    margin: 0; padding-bottom: 2.3cqh;
    border-bottom: 1px solid rgba(0, 0, 0, 0.22);
    color: rgba(0, 0, 0, 0.88);
  }
  .enquiry-form .enquiry-sub {
    font-weight: 300; letter-spacing: 0.16em; text-transform: uppercase;
    font-size: 1.75cqh; color: rgba(0, 0, 0, 0.50);
    margin: 3.2cqh 0 7cqh;
  }
  .enquiry-form label {
    display: block;
    font-weight: 300; letter-spacing: 0.16em; text-transform: uppercase;
    font-size: 1.75cqh; color: rgba(0, 0, 0, 0.75);
    margin: 0 0 4.5cqh;
  }
  .enquiry-form input, .enquiry-form textarea {
    display: block;
    width: 100%;
    margin-top: 1.4cqh;
    background: transparent;
    border: none; border-bottom: 1px solid rgba(0, 0, 0, 0.3);
    padding: 0.6cqh 0;
    font-family: inherit;
    font-weight: 300; letter-spacing: 0.01em; text-transform: none;
    font-size: 2.9cqh;
    color: #000;
    outline: none;
  }
  .enquiry-form input:focus, .enquiry-form textarea:focus { border-bottom-color: #000; }
  .enquiry-form textarea { resize: vertical; min-height: 8cqh; }
  .enquiry-form button[type="submit"] {
    display: block;
    margin-top: 1.5cqh;
    background: none; border: none; border-bottom: 2px solid #000;
    padding: 0.4cqh 0;
    font-family: inherit;
    font-weight: 700; letter-spacing: 0.02em;
    font-size: 2.9cqh;
    color: #000;
    cursor: pointer;
  }
  .enquiry-form button[type="submit"]:hover { opacity: 0.7; }
  .enquiry-form .enquiry-status {
    margin: 2cqh 0 0;
    font-weight: 300; letter-spacing: 0.1em;
    font-size: 1.75cqh; color: rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
<div class="story-overlay" id="storyOverlay">
  <div class="story-text" id="storyText">
    <div class="story-cover-title" id="storyCoverTitle">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="story-body" id="storyBody"></div>
  </div>
  <div class="enquiry-form" id="enquiryForm">
    <h1>ENQUIRIES</h1>
    <p class="enquiry-sub">get in touch · looking for like minded</p>
    <form id="enquiryFormEl">
      <label>NAME:<input type="text" name="name" autocomplete="name" required></label>
      <label>EMAIL:<input type="email" name="email" autocomplete="email" required></label>
      <label>MESSAGE:<textarea name="message" required></textarea></label>
      <button type="submit">SUBMIT</button>
      <p class="enquiry-status" id="enquiryStatus"></p>
    </form>
  </div>
</div>
<script src="/vendor/three.min.js"></script>
<script>
// ── Nested ring ───────────────────────────────────────────────────────────────
// ?ring=detroit renders the Detroit set through this same file. Duplicating the
// ring into a second page was the alternative, and it would have drifted from
// this one the first time either was touched; the cards are data, so only the
// data changes. The index constants below are the main ring's special cases —
// they are set to -1 here so no Detroit card can match one and inherit its
// behaviour (PORTALS[-1] is undefined, which no real portal equals).
const RING = (() => { try { return new URLSearchParams(location.search).get('ring') || 'main' } catch (e) { return 'main' } })()
const DETROIT_RING = [
  { title: 'THE FACES',   sub: 'as they were drawn',        bg: '#A1A1A1', light: false, href: '/detroit_dark.html' },
  { title: 'QUARTERS',    sub: 'cut in four',               bg: '#7C8496', light: true,  href: '/detroit_remix.html' },
  { title: 'NINE',        sub: 'cut into thirds',           bg: '#5E6472', light: true,  href: '/detroit_remix_2.html' },
  { title: 'GRID',        sub: 'thirty-five pieces',        bg: '#474C58', light: true,  href: '/detroit_remix_3.html' },
  { title: 'BLUE',        sub: 'on blue ground',            bg: '#1E2BFF', light: true,  href: '/detroit_remix_4.html' },
  { title: 'FLOOD',       sub: 'dissolved to fields',       bg: '#2530C4', light: true,  href: '/detroit_remix_5.html' },
  { title: 'BLACK',       sub: 'on black ground',           bg: '#0B0B0B', light: true,  href: '/detroit_remix_6.html' },
  { title: 'HALVES',      sub: 'cut once, top and bottom',  bg: '#171717', light: true,  href: '/detroit_remix_7.html' },
  { title: 'CAMO',        sub: 'cut by pattern, not by grid', bg: '#3F4A2E', light: true,  href: '/detroit_remix_8.html' },
  { title: 'ONE FACE',    sub: 'thirty-nine cuts of a single portrait', bg: '#2A2F4A', light: true, href: '/detroit_remix_9.html' },
  { title: 'BLUE GROUND', sub: 'one blue, a random face',    bg: '#171EFD', light: true, href: '/detroit_remix_10.html' },
  { title: 'CHUNKY',      sub: 'two faces, cut in blocks',   bg: '#2B2FA8', light: true, href: '/detroit_remix_11.html' },
  { title: 'ON BLACK',    sub: 'two faces, chunky, on black', bg: '#0B0B0B', light: true, href: '/detroit_remix_12.html' },
  { title: 'SHUFFLE',     sub: 'squares moved, nothing lost', bg: '#6B6042', light: true, href: '/detroit_remix_13.html' },
  { title: 'RUN',         sub: 'one card, a hundred arrangements', bg: '#141414', light: true, href: '/detroit_remix_14.html' },
  { title: 'RUN ON BLACK', sub: 'squares only, nothing beneath', bg: '#000000', light: true, href: '/detroit_remix_15.html' },
  { title: 'RUN ON BLUE', sub: 'the same squares, on the blue', bg: '#1E2BFF', light: true, href: '/detroit_remix_16.html' },
  { title: 'RUN ON WHITE', sub: 'the same squares, on white', bg: '#FFFFFF', light: false, href: '/detroit_remix_17.html' },
  { title: 'RUN FINER',   sub: 'a third more squares',        bg: '#8A8A8A', light: false, href: '/detroit_remix_18.html' },
  { title: 'BOXES',       sub: 'the run, given thickness',    bg: '#3A3A44', light: true,  href: '/detroit_remix_19.html' },
]


let PORTALS = [
  { title: 'OSWIN JOURNAL',    sub: 'exploration of sound and image',          bg: '#FFFFFF', light: false },
  { title: 'MOVING IMAGES',    sub: 'immersive exploration',                   bg: '#C4C4C4', light: false },
  { title: 'ARCHIVE',          sub: 'the previous alextaves.com',              bg: '#0B0B0B', light: true, titleColor: '#D8FF14' },
  { title: 'FICTION',          sub: 'sci fi meets absurdism',                  bg: '#FF5F00', light: false },
  { title: 'ALEX TAVES',       sub: 'a bit about me',                         bg: '#FFFFFF', light: false },
  { title: 'ENQUIRIES',        sub: 'get in touch · looking for like minded',  bg: '#00C2A8', light: false },
  { title: 'UNFILTERED IDEAS', sub: 'a journal',                               bg: '#D9D02F', light: false },
  { title: 'DETROIT',          sub: 'split in four',                           bg: '#A1A1A1', light: false,
    body: '2,313,441 recombinations of thirty-nine faces. you are unlikely to see the same work twice.' },
  { title: 'POSTCARDS',        sub: '2016',                                    bg: '#A69A8C', light: false },
]
if (RING === 'detroit') PORTALS = DETROIT_RING

// The WELCOME entry portal shows on every fresh page load. Whether it's already
// been begun is driven by the parent app via a ?begun=1 URL param (NOT
// sessionStorage — that survived refreshes and hid the entry permanently). The
// parent sets begun=1 only when it re-mounts this iframe after a portal return,
// so backing out of a portal skips the entry, but a full refresh shows it again.
let welcomeBegun = false
try { welcomeBegun = new URLSearchParams(location.search).get('begun') === '1' } catch (e) {}
if (!welcomeBegun && RING !== 'detroit') {
  PORTALS.push({ title: 'WELCOME', sub: 'recommended to have audio on', bg: '#001ABE', light: true, welcome: true })
}


const COUNT = PORTALS.length
const MAIN = RING === 'main'   // -1 disables a special case on the nested ring
// Comparisons against PORTALS[-1] are safe (undefined equals no real portal),
// but the four places that DEREFERENCE one of these indices are not — two run
// at load time and threw the whole script, which is why the ring came up black.
// Those four use optional chaining.
const UNFILTERED_INDEX = MAIN ? 6 : -1
const ENQUIRIES_INDEX = MAIN ? 5 : -1
const OSWIN_INDEX = MAIN ? 0 : -1
const MOVING_IMAGES_INDEX = MAIN ? 1 : -1
const ALEX_TAVES_INDEX = MAIN ? 4 : -1
const DETROIT_INDEX = MAIN ? 7 : -1
const POSTCARDS_INDEX = MAIN ? 8 : -1
// Appended AFTER postcards, so every existing index is unmoved and
// WELCOME_INDEX (COUNT - 1) still lands on the welcome card.
const DETROIT_REMIX_INDEX = 9
const DETROIT_NINE_INDEX = 10
const DETROIT_GRID_INDEX = 11
const DETROIT_BLUE_INDEX = 12
const DETROIT_FLOOD_INDEX = 13
const DETROIT_BLACK_INDEX = 14
const DETROIT_HALVES_INDEX = 15
const ARCHIVE_INDEX = 2   // was STILL IMAGES — now the archive showreel, links to /archive
const ARCHIVE_URL = '/archive/index.html'   // explicit file → works in dev & prod; /archive also serves it via _redirects
// -1 on the nested ring too: with no welcome card appended there, COUNT - 1
// pointed at the last Detroit card and would have taken its click as the
// welcome control instead of opening the page.
const WELCOME_INDEX = (welcomeBegun || !MAIN) ? -1 : (COUNT - 1)   // last portal, or none once begun

// Entry state: ring is static until Begin is pressed; audio preference starts ON.
// The nested ring has no welcome card, so it must never start in the entry
// state — it would sit locked and unlit waiting for a Begin press that has
// nothing to press, and the angle below would seek WELCOME_INDEX = -1.
let welcomeActive = MAIN && !welcomeBegun
let welcomeAudioOn = true
let welcomeRegions = null   // {on,off,begin} hit rects in 600×800 card pixels

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene()
const bgC = document.createElement('canvas'); bgC.width = 4; bgC.height = 512
const bgCtx = bgC.getContext('2d')
const bgG = bgCtx.createLinearGradient(0, 0, 0, 512)
bgG.addColorStop(0, '#16110d'); bgG.addColorStop(1, '#0a0704')
bgCtx.fillStyle = bgG; bgCtx.fillRect(0, 0, 4, 512)
const bgTex = new THREE.CanvasTexture(bgC); bgTex.encoding = THREE.sRGBEncoding
scene.background = bgTex
scene.fog = new THREE.Fog('#0e0b08', 8, 50)

// Touch-capability detection (ontouchstart/maxTouchPoints) is unreliable on
// Chrome for iOS specifically — it's a WKWebView wrapper, not Safari's native
// engine plumbing, and has been observed reporting no touch support at all,
// which silently forces the desktop code path on an actual phone regardless
// of the page's own site-mode setting. Viewport width alone is a sufficient,
// more robust signal for "this is a phone/small tablet".
const isMobile = innerWidth < 1024
const RADIUS    = 6.0
const CAM_Z     = 10.0
const MOB_CAM_Z = 2.5
// Mobile ring radius must stay smaller than MOB_CAM_Z so the camera sits
// outside the ring looking in (same relationship desktop has: CAM_Z > RADIUS).
// Using the desktop RADIUS here would put the camera *inside* the ring on
// mobile, causing panels to flip/invert as they cross behind it.
const MOB_RADIUS = 1.5

// Mobile browsers can report a taller innerHeight at load than what's
// actually settled/visible once the address bar finishes animating, and
// visualViewport.height disagrees between Safari and Chrome on the same
// device. CSS `svh` (small viewport height) is the standards-based fix: a
// WebKit-engine-level primitive guaranteed to reflect the height visible
// with the toolbar fully expanded, so it behaves consistently across
// browser apps sharing that engine. Desktop is untouched (plain innerHeight).
const svhProbe = document.createElement('div')
svhProbe.style.cssText = 'position:fixed; top:0; left:0; height:100svh; width:0; visibility:hidden; pointer-events:none;'
document.body.appendChild(svhProbe)
const viewportH = () => {
  if (!isMobile) return innerHeight
  const svh = svhProbe.getBoundingClientRect().height
  const vv = window.visualViewport ? window.visualViewport.height : innerHeight
  return svh > 0 ? Math.min(svh, innerHeight) : Math.min(innerHeight, vv)
}

const camera = new THREE.PerspectiveCamera(55, innerWidth / viewportH(), 0.1, 200)
camera.position.set(0, 0, isMobile ? MOB_CAM_Z : CAM_Z)
camera.lookAt(0, 0, 0)

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
renderer.setSize(innerWidth, viewportH())
// Adaptive resolution. This scene is fragment-bound (many large translucent,
// blended panels + AA), so on a Retina/high-DPI or weaker GPU, rendering at 2x
// device pixels is what makes the ring step like a second hand. Start at a
// lighter ratio and let the render loop drop it further if the machine can't
// hold framerate — smoothness matters more than a slightly softer image here.
const MAX_PR = Math.min(devicePixelRatio, 2)
let curPR = Math.min(devicePixelRatio, 1.25)
renderer.setPixelRatio(curPR)
renderer.outputEncoding = THREE.sRGBEncoding
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
document.body.appendChild(renderer.domElement)

// ── Environment ───────────────────────────────────────────────────────────────
const envScene = new THREE.Scene()
envScene.background = new THREE.Color('#0e0b08')
;[
  [0, 8, 0, 8, 8, 1.6], [6, 2, 0, 4, 8, 0.02],
  [-6, 2, 0, 4, 8, 0.02], [0, -6, 0, 12, 12, 0.0],
].forEach(([x, y, z, w, h, b]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(b) }))
  m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m)
})
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(envScene, 0, 0.1, 200).texture
scene.add(new THREE.HemisphereLight('#2a1a0a', '#0e0806', 0.15))
const key = new THREE.DirectionalLight('#ffffff', 1.1); key.position.set(4, 6, 5)
const rim = new THREE.DirectionalLight('#ffcf90', 0.5); rim.position.set(-5, 2, -4)
scene.add(key, rim)

// ── Panel geometry ────────────────────────────────────────────────────────────
const nearDist    = CAM_Z - RADIUS
const mobNearDist = MOB_CAM_Z - MOB_RADIUS
const vFOV = (camera.fov * Math.PI) / 180
let panelW, panelH
if (isMobile) {
  const hFOVhalf = Math.atan(Math.tan(vFOV / 2) * camera.aspect)
  panelW = 2 * mobNearDist * Math.tan(hFOVhalf) * 0.95
  panelH = panelW * (4 / 3)
} else {
  panelH = 0.9 * 2 * nearDist * Math.tan(vFOV / 2)
  panelW = panelH * (3 / 4)
}
// THICK is the card's physical depth in world units. Kept proportional to
// panelH (rather than a fixed absolute value) so its edge — visible as a
// dim sliver whenever a card isn't perfectly flat-on to the camera — reads
// at the same relative size on mobile as on desktop. Mobile's camera sits
// much closer to the ring (2.5 vs 10 units away), so the same absolute
// thickness used to look proportionally far more prominent there.
const desktopPanelHRef = 0.9 * 2 * nearDist * Math.tan(vFOV / 2)
const THICK      = 0.16 * (panelH / desktopPanelHRef)
const REFL_FRAC  = 0.55
const FRONT_OPACITY = 0.92
const BACK_OPACITY  = 0.42
// SPREAD < 1 compresses ring position without compressing each panel's own
// facing angle (computed from the true, uncompressed geometry below) — on
// the vertical mobile ring that mismatch crowds far more panels into the
// camera's view at once than the FOV should allow, and mismatches each
// one's tilt against where it's actually drawn. Full spread avoids both.
const SPREAD = 1.0
// Mobile touch feel matches the desktop drag/momentum physics (SENS,
// AUTO_SPEED, MAX_VEL, FRICTION below) — same ring, same units (radians),
// just spun about the vertical axis instead of the horizontal one, and
// driven by a vertical swipe instead of a horizontal drag.
const MOB_TOUCH_SENS = 0.006
const panelGeo = new THREE.BoxGeometry(panelW, panelH, THICK)
const reflH    = panelH * REFL_FRAC
const reflGeo  = new THREE.PlaneGeometry(panelW, reflH)

// ── Alpha map ─────────────────────────────────────────────────────────────────
const roundedAlphaMap = (() => {
  const W = 128, H = Math.round(W * panelH / panelW)
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  const r = 5
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H)
  ctx.filter = 'blur(2.5px)'
  ctx.beginPath()
  ctx.moveTo(r, 0); ctx.lineTo(W - r, 0)
  ctx.arcTo(W, 0, W, r, r); ctx.lineTo(W, H - r)
  ctx.arcTo(W, H, W - r, H, r); ctx.lineTo(r, H)
  ctx.arcTo(0, H, 0, H - r, r); ctx.lineTo(0, r)
  ctx.arcTo(0, 0, r, 0, r); ctx.closePath()
  ctx.fillStyle = '#fff'; ctx.fill()
  return new THREE.CanvasTexture(c)
})()

// ── Glow reflection ───────────────────────────────────────────────────────────
function makePortalReflTex(bgHex) {
  const r = parseInt(bgHex.slice(1,3), 16)
  const g = parseInt(bgHex.slice(3,5), 16)
  const b = parseInt(bgHex.slice(5,7), 16)
  const W = 256, H = 160
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  const grd = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, W * 0.72)
  grd.addColorStop(0,    `rgba(${r},${g},${b},0.55)`)
  grd.addColorStop(0.35, `rgba(${r},${g},${b},0.22)`)
  grd.addColorStop(0.7,  `rgba(${r},${g},${b},0.06)`)
  grd.addColorStop(1,    `rgba(${r},${g},${b},0.0)`)
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H)
  const fade = ctx.createLinearGradient(0, 0, 0, H)
  fade.addColorStop(0,    'rgba(14,11,8,0.55)')
  fade.addColorStop(0.12, 'rgba(14,11,8,0.0)')
  fade.addColorStop(0.7,  'rgba(14,11,8,0.0)')
  fade.addColorStop(1,    'rgba(14,11,8,0.82)')
  ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// ── Duotone trace — a faint single-hue impression of a video frame or still
// image, composited behind a card's title so it reads as a subtle imprint
// of the content ("a hint of the video play") rather than a picture in its
// own right. Reuses the portal's own bg colour as the tint, so it always
// "reads" as that card's colour, just varied by the source's luminance.
const duotoneOff = document.createElement('canvas')
const duotoneOffCtx = duotoneOff.getContext('2d')
function drawDuotoneTrace(ctx, source, W, H, tintHex, alpha, grayscaleAmt = 1) {
  const sw = source.videoWidth || source.naturalWidth
  const sh = source.videoHeight || source.naturalHeight
  if (!sw || !sh) return
  duotoneOff.width = W; duotoneOff.height = H
  duotoneOffCtx.filter = `grayscale(${grayscaleAmt}) contrast(1.1)`
  const scale = Math.max(W / sw, H / sh)
  const dw = sw * scale, dh = sh * scale
  duotoneOffCtx.drawImage(source, (W - dw) / 2, (H - dh) / 2, dw, dh)
  duotoneOffCtx.filter = 'none'
  duotoneOffCtx.globalCompositeOperation = 'multiply'
  duotoneOffCtx.fillStyle = tintHex
  duotoneOffCtx.fillRect(0, 0, W, H)
  duotoneOffCtx.globalCompositeOperation = 'source-over'
  ctx.save()
  ctx.globalAlpha = alpha
  ctx.drawImage(duotoneOff, 0, 0, W, H)
  ctx.restore()
}

// Swimmer marquee trace: each figure is height-fit to the card and the
// seamless tile is repeated across, offset by swimScroll so the figures
// drift right-to-left. Same duotone (grayscale → tint multiply) as the trace
// above, so it reads identically to the diver it replaced.
const SWIM_TILE_ASPECT = 555 / 995   // seamless tile's own width / height
const SWIM_SCROLL_SPEED = 0.12       // tile-widths per second, right-to-left
const SWIM_WATER = 0.08              // ripple strength — a touch of water, gentler than the marquee
const SWIM_CAUSTIC = 0.04           // caustic shimmer strength (subtle)
let swimScroll = 0                   // accumulated tile-widths
let swimTime = 0                     // seconds, drives the ripple + caustic phase

// Caustic shimmer: the marquee's shader adds a moving light-mesh (product of
// two drifting sine gratings) on top of the figure. We reproduce it on a small
// offscreen buffer — cheap to compute, and upscaling softens it into blobs —
// then composite it additively over the card.
const CAUSTIC_W = 150, CAUSTIC_H = 200
const causticCanvas = document.createElement('canvas')
causticCanvas.width = CAUSTIC_W; causticCanvas.height = CAUSTIC_H
const causticCtx = causticCanvas.getContext('2d')
const causticData = causticCtx.createImageData(CAUSTIC_W, CAUSTIC_H)
function drawCaustics(ctx, W, H, t) {
  const d = causticData.data
  let i = 0
  for (let py = 0; py < CAUSTIC_H; py++) {
    const uy = py / CAUSTIC_H
    for (let px = 0; px < CAUSTIC_W; px++) {
      const ux = px / CAUSTIC_W
      const c = (Math.sin(ux * 22.0 + uy * 18.0 + t * 1.6) * 0.5 + 0.5)
              * (Math.sin(ux * 11.0 - uy * 26.0 - t * 2.1) * 0.5 + 0.5)
      d[i] = 255; d[i + 1] = 255; d[i + 2] = 255
      d[i + 3] = c * SWIM_CAUSTIC * 255
      i += 4
    }
  }
  causticCtx.putImageData(causticData, 0, 0)
  ctx.save()
  ctx.globalCompositeOperation = 'lighter'
  ctx.imageSmoothingEnabled = true
  ctx.drawImage(causticCanvas, 0, 0, W, H)
  ctx.restore()
}
function drawSwimTrace(ctx, W, H, tintHex, alpha, grayscaleAmt = 1) {
  const tile = swimGrayTile || (swimImg.complete && swimImg.naturalWidth ? swimImg : null)
  if (!tile) return
  // 1. Build the scrolling, tiled figure as a plain greyscale plate offscreen.
  //    The greyscale/contrast is pre-baked into swimGrayTile once (buildSwimGray),
  //    so this loop is plain drawImage — no per-frame canvas filter. Size the
  //    offscreen only when it changes, so we don't reallocate it every frame.
  if (duotoneOff.width !== W || duotoneOff.height !== H) { duotoneOff.width = W; duotoneOff.height = H }
  else duotoneOffCtx.clearRect(0, 0, W, H)
  const dh = H
  const dw = dh * SWIM_TILE_ASPECT
  const startX = -(((swimScroll % 1) + 1) % 1) * dw
  for (let x = startX; x < W; x += dw) {
    duotoneOffCtx.drawImage(tile, x, 0, dw, dh)
  }
  // 2. Composite to the card in horizontal slices, each nudged sideways by the
  //    same sine ripple the marquee shader uses, so the figure reads as seen
  //    through moving water.
  ctx.save()
  ctx.globalAlpha = alpha
  const SLICE = 3
  for (let y = 0; y < H; y += SLICE) {
    const v = y / H
    const dx = (Math.sin(v * 14.0 + swimTime * 1.3) * 0.014
              + Math.sin(v * 23.0 - swimTime * 0.8) * 0.006) * SWIM_WATER * W
    ctx.drawImage(duotoneOff, 0, y, W, SLICE, dx, y, W, SLICE)
  }
  ctx.restore()
  // Bright caustic light-mesh over the figure, at full additive strength.
  drawCaustics(ctx, W, H, swimTime)
}

// OSWIN JOURNAL: a large black circle filling most of the bottom 3/4 of the
// card, below the title/rule/subtitle header band.
function drawOswinCircle(ctx, W, H, portal) {
  const top = Math.max(H * 0.25, titleLayout(ctx, portal, W - 108).headerBottom + 10)
  const margin = 20

}

// ── Portal card texture ───────────────────────────────────────────────────────
// drawTrace(ctx, W, H), if given, is called right after the bg fill and
// before the title — used to bake in the faint duotone trace above.
// Mean luminance of a card region — used to decide whether the title needs a
// light or dark ink to read against whatever the image puts behind it.
function regionLuma(ctx, x, y, w, h) {
  const data = ctx.getImageData(x, y, w, h).data
  let sum = 0, n = 0
  for (let i = 0; i < data.length; i += 16) {
    sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]; n++
  }
  return sum / n
}

// The genuine lightest colour of a trace panel's *source* photo (before the
// duotone tint darkens it). Cached once the image has loaded.
const _srcLightest = new Map()
function sourceLightest(portal) {
  if (_srcLightest.has(portal)) return _srcLightest.get(portal)
  const img = portal === PORTALS[DETROIT_INDEX] ? detroitTraceImg
            : portal === PORTALS[POSTCARDS_INDEX] ? postcardsTraceImg
            : portal === PORTALS[MOVING_IMAGES_INDEX] ? swimImg : null
  if (!img || !img.complete || !img.naturalWidth) return null
  const w = 100, h = 133
  const oc = document.createElement('canvas'); oc.width = w; oc.height = h
  const octx = oc.getContext('2d'); octx.drawImage(img, 0, 0, w, h)
  const d = octx.getImageData(0, 0, w, h).data
  let bl = -1, r = 245, g = 245, b = 245
  for (let i = 0; i < d.length; i += 4) {
    const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]
    if (l > bl) { bl = l; r = d[i]; g = d[i + 1]; b = d[i + 2] }
  }
  const c = { r, g, b }; _srcLightest.set(portal, c); return c
}

// Which titles currently read as light ink; sticky per portal (hysteresis) so
// the animated Moving Images card doesn't flicker as its backdrop scrolls.
// _titleSampled throttles the (costly) getImageData for the animated card.
const _titleLight = new Map()
const _titleSampled = new Map()

// Shared title metrics: keep the type large and wrap long titles onto two lines
// (three only if a title truly won't fit one word per line at the minimum size),
// shrinking only as a last resort. Also reports where the header ends so the
// content cards can start their body below a taller, wrapped title.
function titleLayout(ctx, portal, maxW) {
  let size = 74, lines
  for (; size >= 24; size -= 2) {
    ctx.font = `700 ${size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
    ctx.letterSpacing = '-0.01em'
    lines = wrapText(ctx, portal.title, maxW)
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width))
    if (lines.length <= 3 && widest <= maxW) break
  }
  const lineH = size
  const titleTop = 64
  const titleBottom = titleTop + lines.length * lineH
  const ruleY = titleBottom + 10
  const subTop = ruleY + 12
  const headerBottom = subTop + 24
  return { size, lines, lineH, titleTop, titleBottom, ruleY, subTop, headerBottom }
}

// WELCOME entry portal: same header system as the others (chartreuse plate,

  ctx.strokeStyle = inkRule; ctx.lineWidth = 0.5
  ctx.beginPath(); ctx.moveTo(lm, t.ruleY); ctx.lineTo(W - lm, t.ruleY); ctx.stroke()
  ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"; ctx.letterSpacing = '0.16em'

    .forEach((ln) => { ctx.fillText(ln, lm, iy); iy += 24 })

function drawPortalCard(ctx, portal, W, H, lm, drawTrace) {
  ctx.clearRect(0, 0, W, H)
  ctx.fillStyle = portal.bg; ctx.fillRect(0, 0, W, H)
  if (drawTrace) drawTrace(ctx, W, H)

  // WELCOME entry portal — bespoke layout with ON/OFF + Begin controls.
  if (portal.welcome) { drawWelcomeCard(ctx, W, H, portal, lm); return }

  let ink     = portal.light ? 'rgba(255,255,255,0.92)' : 'rgba(0,0,0,0.88)'
  let inkSub  = portal.light ? 'rgba(255,255,255,0.52)' : 'rgba(0,0,0,0.50)'
  let inkRule = portal.light ? 'rgba(255,255,255,0.30)' : 'rgba(0,0,0,0.22)'

  const maxW = W - lm * 2
  ctx.textAlign = 'left'
  const t = titleLayout(ctx, portal, maxW)

  // Detroit/Postcards/Moving Images: when the image behind the title is dark,
  // switch the header to the source photo's lightest tone so it pops; keep the
  // dark ink when the backdrop is light. Re-evaluated every redraw (so it flips
  // between the faded and full-colour held looks), with hysteresis to stop the
  // animated Moving Images card flickering near the threshold.
  if (portal === PORTALS[DETROIT_INDEX] || portal === PORTALS[POSTCARDS_INDEX] || portal === PORTALS[MOVING_IMAGES_INDEX]) {
    // Deciding the title colour needs a getImageData pixel read-back. For the
    // static Detroit/Postcards cards (redrawn rarely) that's fine every redraw.
    // But the Moving Images card redraws ~60x/sec, and re-sampling it a few times
    // a second allocated a fresh ~300KB ImageData each time — ~2.5MB/s of garbage
    // that filled the heap and triggered a main-thread GC pause ~10-15s in (the
    // "runs great then studders" onset). Its water backdrop keeps a near-constant
    // brightness in the title band, so sample it ONCE and reuse the result.
    const animated = portal === PORTALS[MOVING_IMAGES_INDEX]
    const now = performance.now()
    // Sample the animated card's brightness once — but only after its water tile
    // is actually drawn, so the title colour latches onto real content, not the
    // bare background. Non-animated cards re-check every (rare) redraw as before.
    const due = animated ? (!!swimGrayTile && !_titleLight.has(portal)) : true
    if (due) {
      _titleSampled.set(portal, now)
      const bandH = Math.max(20, Math.min(H - t.titleTop - 2, t.titleBottom - t.titleTop))
      const backLuma = regionLuma(ctx, lm, t.titleTop, maxW, bandH)
      let light = _titleLight.get(portal) ?? (backLuma < 135)
      if (backLuma < 120) light = true
      else if (backLuma > 155) light = false
      _titleLight.set(portal, light)
    }
    if (_titleLight.get(portal)) {
      const c = sourceLightest(portal) || { r: 245, g: 245, b: 245 }
      ink     = `rgba(${c.r},${c.g},${c.b},0.96)`
      inkSub  = `rgba(${c.r},${c.g},${c.b},0.60)`
      inkRule = `rgba(${c.r},${c.g},${c.b},0.40)`
    }
  }

  // Fixed heading colour (e.g. ARCHIVE's chartreuse), overriding the defaults.
  if (portal.titleColor) {
    ink     = portal.titleColor + 'F2'
    inkSub  = portal.titleColor + '99'
    inkRule = portal.titleColor + '55'
  }

  ctx.font = `700 ${t.size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.letterSpacing = '-0.01em'
  ctx.textBaseline = 'top'
  ctx.fillStyle = ink
  t.lines.forEach((ln, i) => ctx.fillText(ln, lm, t.titleTop + i * t.lineH))

  ctx.strokeStyle = inkRule; ctx.lineWidth = 0.5
  ctx.beginPath(); ctx.moveTo(lm, t.ruleY); ctx.lineTo(W - lm, t.ruleY); ctx.stroke()

  ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
  ctx.letterSpacing = '0.16em'
  ctx.textBaseline = 'top'
  ctx.fillStyle = inkSub
  ctx.fillText(portal.sub, lm, t.subTop)

  // Optional description, wrapped, beneath the subtitle — for a card that has
  // to say what is behind it rather than just name it.
  if (portal.body) {
    ctx.font = "300 16px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.02em'
    let by = t.subTop + 34
    wrapText(ctx, portal.body, W - lm * 2).forEach((ln) => { ctx.fillText(ln, lm, by); by += 24 })
  }
}

function makePortalTex(portal, drawTrace) {

function makeFlippedTex(canvas) {
  const c = document.createElement('canvas')
  c.width = canvas.width; c.height = canvas.height
  const ctx = c.getContext('2d')
  ctx.translate(c.width, 0); ctx.scale(-1, 1)
  ctx.drawImage(canvas, 0, 0)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// ── Build ring (horizontal, XZ plane) ─────────────────────────────────────────
const orbitQuat = new THREE.Quaternion()
const orbitEuler = new THREE.Euler()

// MOVING IMAGES gets a faint duotone trace of the swimmer marquee — the
// seamless leaping figure (water2_seamless.webp) height-fit to the card and
// tiled across, scrolling right-to-left like the full-screen marquee, under

swimImg.src = '/water2_seamless.webp'

// Pre-bake the grayscale+contrast version of the swim tile ONCE. drawSwimTrace
// tiles this across the card every frame; doing the `grayscale(1) contrast(1.1)`
// canvas filter per tile per frame (the old path) was the single most expensive
// thing in the render loop and is what stuttered the ring while spinning.
let swimGrayTile = null
function buildSwimGray() {
  if (!swimImg.naturalWidth) return
  const c = document.createElement('canvas')
  c.width = swimImg.naturalWidth; c.height = swimImg.naturalHeight
  const cx = c.getContext('2d')
  cx.filter = 'grayscale(1) contrast(1.1)'
  cx.drawImage(swimImg, 0, 0)
  swimGrayTile = c
}

  const wh = hits.find(h => h.object.userData.panelIdx === WELCOME_INDEX)
  if (!wh || !wh.uv || !welcomeRegions) return
  const cx = wh.uv.x * 600, cy = (1 - wh.uv.y) * 800   // uv → card pixels (flipY)
  const inR = r => cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h
  if (inR(welcomeRegions.begin)) beginSite()
  else if (inR(welcomeRegions.on)) setWelcomeAudio(true)
  else if (inR(welcomeRegions.off)) setWelcomeAudio(false)
}

const JOURNAL_CHAR_MS = 32.5 // 2x IntroOverlay's typewriter cadence
const JOURNAL_HOLD_MS = 3000

function wrapText(ctx, text, maxW) {
  const words = text.split(' ')
  const lines = []
  let line = ''
  for (const w of words) {
    const test = line ? line + ' ' + w : w
    if (line && ctx.measureText(test).width > maxW) {
      lines.push(line)
      line = w
    } else {
      line = test
    }
  }
  if (line) lines.push(line)
  return lines
}

function drawJournalQuote(ctx, W, H, portal) {
  const lm = 54
  const startY = Math.max(234, titleLayout(ctx, portal, W - lm * 2).headerBottom)
  const quote = JOURNAL_QUOTES[journalQuoteIdx]
  const done = journalCharCount >= quote.text.length
  const shown = done ? quote.text : quote.text.slice(0, journalCharCount)
  const inkQuote = portal.light ? 'rgba(255,255,255,0.72)' : 'rgba(0,0,0,0.68)'
  const inkDate  = portal.light ? 'rgba(255,255,255,0.40)' : 'rgba(0,0,0,0.38)'

  ctx.textAlign = 'left'
  ctx.font = "300 15px 'Helvetica Neue', Helvetica, Arial, sans-serif"
  ctx.letterSpacing = '0.01em'
  ctx.fillStyle = inkQuote
  const display = done ? `"${shown}"` : `"${shown}`
  const lines = wrapText(ctx, display, W - lm * 2)
  const lineHeight = 24
  let y = startY
  lines.forEach((ln) => { ctx.fillText(ln, lm, y); y += lineHeight })

  if (done) {
    ctx.font = "300 12px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = inkDate
    ctx.fillText(quote.date, lm, y + 8)
  }
}

// Press-and-hold reveal: Detroit and Postcards redraw their own card texture
// with the trace swapped between its resting look (75% grayscale, 0.5 alpha —
// faint) and a full-colour, full-opacity look (0% grayscale, 1.0 alpha) while
// the card is actively held.
// Each trace panel has only two looks (faint resting / full-colour held). Both
// are expensive to render (getImageData luma read + a grayscale canvas filter on
// a large image), and setHeldTrace can ask for them every time a drag crosses the
// card — which is what stuttered the DETROIT/POSTCARDS cluster. So render each
// look ONCE, cache the pixels, and thereafter just blit the cached face.
const _traceFaceCache = new Map()   // key `${idx}:${held}` -> ImageData
function redrawTraceCard(idx, grayscaleAmt, alpha) {
  const held = grayscaleAmt === TRACE_GRAYSCALE_HELD
  const key = idx + ':' + held
  const faceTex = faceTexes[idx]
  const ctx = faceTex.image.getContext('2d')
  const cached = _traceFaceCache.get(key)
  if (cached) {
    ctx.putImageData(cached, 0, 0)
  } else {
    const portal = PORTALS[idx]
    const traceImg = idx === DETROIT_INDEX ? detroitTraceImg : postcardsTraceImg
    // If the source image isn't decoded yet, draw live (don't cache an empty face).
    const drawTrace = (c, W, H) => drawDuotoneTrace(c, traceImg, W, H, portal.bg, alpha, grayscaleAmt)
    drawPortalCard(ctx, portal, 600, 800, 54, drawTrace)
    if (traceImg.complete && (traceImg.naturalWidth || traceImg.videoWidth)) {
      _traceFaceCache.set(key, ctx.getImageData(0, 0, faceTex.image.width, faceTex.image.height))
    }
  }
  faceTex.needsUpdate = true
}
// The panel currently pressed and held. Any held panel renders fully opaque
// (see the loop below); Detroit/Postcards additionally recolour their trace to
// full colour + full opacity. Everything reverts on release.
let heldTraceIdx = null
const isTracePanel = (i) => i === DETROIT_INDEX || i === POSTCARDS_INDEX
function setHeldTrace(idx) {
  if (heldTraceIdx === idx) return
  if (isTracePanel(heldTraceIdx)) redrawTraceCard(heldTraceIdx, TRACE_GRAYSCALE, 0.5)
  heldTraceIdx = idx
  if (isTracePanel(idx)) redrawTraceCard(idx, TRACE_GRAYSCALE_HELD, 1.0)
}
function clearHeldTrace() {
  if (heldTraceIdx === null) return
  if (isTracePanel(heldTraceIdx)) redrawTraceCard(heldTraceIdx, TRACE_GRAYSCALE, 0.5)
  heldTraceIdx = null
}

      { date: "JULY 8, 2026", text: "The Jasper piece, argued and won. A brilliant artist lives in my house. A week of two-hour sessions, existing Three.js patterns, one track, one interactive piece. A gift he can show his friends and teachers, the smallest possible demo of the portal ecosystem, and an audience-building artifact all at once. Not drift. Resequencing, and the window is his enthusiasm, which does not wait." },
    ],
  },
  [ALEX_TAVES_INDEX]: {
    coverLines: ['ALEX', 'TAVES'],

    bg: PORTALS[ALEX_TAVES_INDEX]?.bg,
    paragraphs: [
      "Alex Taves builds rooms on the internet, part of what he calls the Slow Web, and his gut says the web is only beginning. He started in fashion, twelve years as art director to Joseph Mimran, then got pulled into the art world and opened a gallery in Hamilton, Ontario. It took off, earned a nod from The New York Times, then crashed. The crash mattered: it opened a whole new world. Out of desperation he learned to code, and React, the framework Netflix runs on, became an obsession. It seemed wildly untapped as a medium for art.",
      "Canadian by birth, Melburnian by choice. His goal is to bridge art and the net. To Alex, platforms like Instagram already feel dated. It's time to evolve into the humans we could be: not desperate for likes, not dictated to by an algorithm.",

const storyOverlay = document.getElementById('storyOverlay')
const storyText = document.getElementById('storyText')
const storyCoverTitle = document.getElementById('storyCoverTitle')
const storyBody = document.getElementById('storyBody')
const enquiryForm = document.getElementById('enquiryForm')
const enquiryFormEl = document.getElementById('enquiryFormEl')
const enquiryStatus = document.getElementById('enquiryStatus')

enquiryFormEl.addEventListener('click', (e) => e.stopPropagation())
enquiryFormEl.addEventListener('submit', (e) => {
  e.preventDefault()
  const name = enquiryFormEl.name.value.trim()
  const email = enquiryFormEl.email.value.trim()
  const message = enquiryFormEl.message.value.trim()
  const subject = `Enquiry from ${name || email}`
  const body = `${message}\n\n— ${name} (${email})`
  window.location.href = `mailto:alextaves@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`
  enquiryStatus.textContent = 'opening your email client…'
})

function setStoryBg(hex) {
  storyOverlay.style.setProperty('--bg', hex)
  storyOverlay.style.setProperty('--bg-r', parseInt(hex.slice(1, 3), 16))
  storyOverlay.style.setProperty('--bg-g', parseInt(hex.slice(3, 5), 16))
  storyOverlay.style.setProperty('--bg-b', parseInt(hex.slice(5, 7), 16))
}

// Exact duplicate of makeTypedOverlay's type/backspace loop (same durations,
// same absolute-clock phase), but writing into DOM line divs instead of a
// canvas — this is the black echo of the portal card's own neon title.
function startCoverTitleLoop(lines, opts) {
  const TYPE_DUR = opts.typeDur, BACKSPACE_DUR = opts.backspaceDur, CYCLE = opts.cycle
  const totalLen = lines.reduce((n, l) => n + l.length, 0)
  const lineEls = Array.from(storyCoverTitle.children)
  let raf = null
  function frame(now) {
    const t = now % CYCLE
    let charCount
    if (t < TYPE_DUR) {
      charCount = Math.min(totalLen, Math.floor((t / TYPE_DUR) * (totalLen + 1)))
    } else if (t > CYCLE - BACKSPACE_DUR) {
      const bt = t - (CYCLE - BACKSPACE_DUR)
      charCount = totalLen - Math.min(totalLen, Math.floor((bt / BACKSPACE_DUR) * (totalLen + 1)))
    } else {
      charCount = totalLen
    }
    const cursorOn = Math.floor(now / 375) % 2 === 0
    let remaining = charCount
    let activeIdx = 0
    lines.forEach((line, i) => {
      const take = Math.max(0, Math.min(line.length, remaining))
      lineEls[i].textContent = line.slice(0, take)
      remaining -= take
      if (take > 0) activeIdx = i
    })
    lineEls.forEach((el, i) => el.classList.toggle('cursor-on', i === activeIdx && cursorOn))
    raf = requestAnimationFrame(frame)
  }
  raf = requestAnimationFrame(frame)
  return () => { if (raf) cancelAnimationFrame(raf) }
}

// Fast terminal-style readout: the paragraphs type in as one continuous
// stream, in reading order, at a fixed character rate — quick enough to
// feel like a data dump, slow enough that each line visibly builds.
const TYPE_CPS = 140
let typingRAF = null

function typeStory(idx) {
  const story = STORIES[idx]
  storyBody.innerHTML = ''
  // A paragraph entry is either a plain string, or a { date, text } object
  // whose date prefix renders bold (see .entry-date).
  const nodes = story.paragraphs.map((entry) => {
    const p = document.createElement('p')
    const dateEl = document.createElement('span')
    dateEl.className = 'entry-date'
    const bodyEl = document.createElement('span')
    p.appendChild(dateEl); p.appendChild(bodyEl)
    storyBody.appendChild(p)
    const datePart = typeof entry === 'string' ? '' : entry.date + ' — '
    const bodyPart = typeof entry === 'string' ? entry : entry.text
    return { el: p, dateEl, bodyEl, datePart, bodyPart, full: datePart + bodyPart }
  })

  const totalLen = nodes.reduce((n, node) => n + node.full.length, 0)
  const startTime = performance.now()
  // Normal stories type start-to-end; reverseReveal types the last entry
  // first and works backward, DOM position unchanged — so already-typed
  // text never moves, it just scrolls out of view as we work backward.
  const order = []
  for (let i = 0; i < nodes.length; i++) order.push(story.reverseReveal ? nodes.length - 1 - i : i)
  let activeIdx = -1

  function tick(now) {
    const charCount = Math.min(totalLen, Math.floor(((now - startTime) / 1000) * TYPE_CPS))
    let offset = 0
    let newActiveIdx = order[order.length - 1]
    let foundActive = false
    order.forEach((i) => {
      const node = nodes[i]
      const take = Math.max(0, Math.min(node.full.length, charCount - offset))
      const dateTake = Math.min(node.datePart.length, take)
      const bodyTake = Math.max(0, take - node.datePart.length)
      node.dateEl.textContent = node.datePart.slice(0, dateTake)
      node.bodyEl.textContent = node.bodyPart.slice(0, bodyTake)
      if (!foundActive && take < node.full.length) { newActiveIdx = i; foundActive = true }
      offset += node.full.length
    })
    if (newActiveIdx !== activeIdx) {
      nodes.forEach((node, i) => node.el.classList.toggle('typing', i === newActiveIdx))
      activeIdx = newActiveIdx
    }
    if (story.reverseReveal) {
      // Hug the bottom: the most-recently-completed entries stay in view at
      // the bottom while older ones silently fill in above, out of sight —
      // the only way to actually watch text being typed is to scroll up,
      // away from the bottom. Only re-pin when already at/near the bottom,
      // so a deliberate scroll-up to watch it type isn't fought every frame.
      const nearBottom = storyOverlay.scrollHeight - storyOverlay.scrollTop - storyOverlay.clientHeight < 48
      if (nearBottom) storyOverlay.scrollTop = storyOverlay.scrollHeight
    }
    // Forward (non-reverseReveal) stories intentionally don't auto-scroll —
    // the overlay opens at the top and stays there, so the reader can start
    // straight away instead of waiting for the typing animation to catch up.
    typingRAF = charCount < totalLen ? requestAnimationFrame(tick) : null
  }
  typingRAF = requestAnimationFrame(tick)
}

let storyOpen = false
let storyPanelIdx = null
const _storyCorner = new THREE.Vector3()

// Projects the clicked panel's own front-face corners to screen space so the
// overlay stays contained within that portal's on-screen shape.
function updateStoryRect() {
  if (storyPanelIdx === null) return
  const mesh = panels[storyPanelIdx]
  mesh.updateMatrixWorld(true)
  const hw = panelW / 2, hh = panelH / 2, z = THICK / 2
  const corners = [[-hw, -hh, z], [hw, -hh, z], [hw, hh, z], [-hw, hh, z]]
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
  corners.forEach(([x, y, zz]) => {
    _storyCorner.set(x, y, zz).applyMatrix4(mesh.matrixWorld).project(camera)
    const sx = (_storyCorner.x * 0.5 + 0.5) * innerWidth
    const sy = (1 - (_storyCorner.y * 0.5 + 0.5)) * viewportH()
    minX = Math.min(minX, sx); maxX = Math.max(maxX, sx)
    minY = Math.min(minY, sy); maxY = Math.max(maxY, sy)
  })
  storyOverlay.style.left = minX + 'px'
  storyOverlay.style.top = minY + 'px'
  storyOverlay.style.width = (maxX - minX) + 'px'
  storyOverlay.style.height = (maxY - minY) + 'px'
}

let coverTitleStop = null
function openStory(idx) {
  if (storyOpen) return
  storyOpen = true
  storyPanelIdx = idx
  angVel = 0
  if (idx === ENQUIRIES_INDEX) {
    setStoryBg(PORTALS[ENQUIRIES_INDEX]?.bg)
    storyText.style.display = 'none'
    enquiryForm.style.display = 'block'
    enquiryFormEl.reset()
    enquiryStatus.textContent = ''
  } else {
    const story = STORIES[idx]
    setStoryBg(story.bg)
    storyText.style.display = ''
    enquiryForm.style.display = 'none'
    if (coverTitleStop) coverTitleStop()
    coverTitleStop = startCoverTitleLoop(story.coverLines, story.coverTypeOpts)
    typeStory(idx)
    if (!story.reverseReveal) storyOverlay.scrollTop = 0
  }
  updateStoryRect()
  storyOverlay.classList.add('active')
}
function closeStory() {
  storyOpen = false
  storyPanelIdx = null
  if (typingRAF) { cancelAnimationFrame(typingRAF); typingRAF = null }
  if (coverTitleStop) { coverTitleStop(); coverTitleStop = null }
  storyOverlay.classList.remove('active')
}
storyOverlay.addEventListener('click', closeStory)
window.addEventListener('keydown', (e) => { if (storyOpen && e.key === 'Escape') closeStory() })

// Panels that navigate away from the carousel entirely (as opposed to
// opening an in-place overlay) need a confirm step — the first click just
// focuses/opacifies the panel, a second click on that same still-focused
// panel is what actually triggers the reroute. Stops a stray click while
// spinning the ring from yanking you out of it.
let pendingConfirmIdx = null

// A click is meant to act on the panel the user is looking at — the one rotated
// to the front of the ring. Picking the nearest raycast hit instead grabs
// whichever large, semi-transparent neighbour happens to intercept the ray
// first (adjacent cards like Detroit/Postcards overlap heavily off-centre), so
// clicks landed on the wrong panel. Selecting the front-most panel by depth is
// deterministic and matches what's visually centred.
function frontPanelIdx() {
  let best = -1, bestZ = -Infinity
  for (let i = 0; i < COUNT; i++) {
    const z = panels[i].position.z
    if (z > bestZ) { bestZ = z; best = i }
  }
  return best
}

function handlePanelClick(idx) {
  if (idx === UNFILTERED_INDEX || idx === ENQUIRIES_INDEX || idx === ALEX_TAVES_INDEX) { openStory(idx); return }
  if (idx === OSWIN_INDEX) { window.open('https://oswinjournal.com', '_blank'); return }
  if (pendingConfirmIdx !== idx) {
    pendingConfirmIdx = idx
    return
  }
  pendingConfirmIdx = null
  if (idx === ARCHIVE_INDEX) {
    (window.top || window).location.href = ARCHIVE_URL
    return
  }
  if (window !== window.top) {
    window.parent.postMessage({ type: 'portalClick', idx, ring: RING }, '*')
  }
}

// The ambient piano lives in the parent app (one continuous layer across
// every ring/page) — this just reports when the user is actively moving
// this ring, not the constant idle auto-rotation.
function notifyRingDrag(dragging) {
  if (window !== window.top) window.parent.postMessage({ type: 'ringDrag', dragging }, '*')
}

// ── Interaction ───────────────────────────────────────────────────────────────
const SENS = 0.005, FRICTION = 2.5, MAX_VEL = 6.0
const AUTO_SPEED = 0.0375, DRAG_THRESH = 6
const raycaster = new THREE.Raycaster()
const clickPointer = new THREE.Vector2()

// On first arrival start with WELCOME front & centre; otherwise a normal ring.
let angle = welcomeActive ? (WELCOME_INDEX / COUNT) * Math.PI * 2 - Math.PI / 2 : 0, angVel = 0
let dragging = false, didDrag = false
let downX = 0, downY = 0, lastX = 0, lastMoveT = 0, trackedVel = 0
// Clicking a panel pauses the auto-rotation so it holds still for the confirm
// tap. The fully-opaque focus look is now driven by press-and-hold (heldTraceIdx),
// not by the click itself. Dragging clears the pause, same as before.
let paused = false

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (isMobile || storyOpen) return
  dragging = true; didDrag = false
  downX = lastX = e.clientX; downY = e.clientY
  lastMoveT = performance.now(); trackedVel = 0
  clickPointer.x = (downX / innerWidth) * 2 - 1
  clickPointer.y = -((downY / innerHeight) * 2 - 1)
  raycaster.setFromCamera(clickPointer, camera)
  const hits = raycaster.intersectObjects(panels, false)
  if (hits.length > 0) setHeldTrace(frontPanelIdx())
})
renderer.domElement.addEventListener('pointermove', (e) => {
  if (isMobile || !dragging || welcomeActive) return
  const now = performance.now()
  const dx  = e.clientX - lastX
  const dtm = Math.max((now - lastMoveT) / 1000, 0.001)
  lastX = e.clientX; lastMoveT = now
  if (Math.abs(e.clientX - downX) > DRAG_THRESH || Math.abs(e.clientY - downY) > DRAG_THRESH) {
    if (!didDrag) { paused = false; pendingConfirmIdx = null; notifyRingDrag(true) }
    didDrag = true
    angle += dx * SENS
    trackedVel = trackedVel * 0.6 + (dx / dtm) * 0.4
  }
})
renderer.domElement.addEventListener('pointerup', () => {
  clearHeldTrace()
  if (isMobile || !dragging) return
  if (didDrag) notifyRingDrag(false)
  dragging = false
  if (!didDrag) {
    clickPointer.x = (downX / innerWidth) * 2 - 1
    clickPointer.y = -((downY / innerHeight) * 2 - 1)
    raycaster.setFromCamera(clickPointer, camera)
    const hits = raycaster.intersectObjects(panels, false)
    // Entry state: the only live controls are ON / OFF / Begin on the WELCOME card.
    if (welcomeActive) { handleWelcomeClick(hits); return }
    if (hits.length > 0) { paused = true; handlePanelClick(frontPanelIdx()) }
  } else {
    const av = (performance.now() - lastMoveT > 120) ? 0 : trackedVel * SENS
    angVel = Math.max(-MAX_VEL, Math.min(MAX_VEL, av))
  }
})
renderer.domElement.addEventListener('pointerleave', clearHeldTrace)
renderer.domElement.addEventListener('pointercancel', clearHeldTrace)

// Mobile touch — vertical swipe (ring spins on the vertical axis on mobile)
let touchId = null, touchLastY = 0, touchLastT = 0, touchVel = 0
let mobHSwiping = false, touchStartX = 0, touchStartY = 0

renderer.domElement.addEventListener('touchstart', (e) => {
  if (!isMobile || storyOpen) return
  e.preventDefault()
  const t = e.touches[0]
  touchId = t.identifier
  touchStartX = t.clientX
  touchStartY = touchLastY = t.clientY
  touchLastT = performance.now()
  touchVel = 0; mobHSwiping = false
  dragging = true
  clickPointer.x = (t.clientX / innerWidth) * 2 - 1
  clickPointer.y = -((t.clientY / viewportH()) * 2 - 1)
  raycaster.setFromCamera(clickPointer, camera)
  const holdHits = raycaster.intersectObjects(panels, false)
  if (holdHits.length > 0) setHeldTrace(frontPanelIdx())
}, { passive: false })
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!isMobile || welcomeActive) return
  e.preventDefault()
  const t = Array.from(e.touches).find(x => x.identifier === touchId)
  if (!t) return
  const now = performance.now()
  const dy  = t.clientY - touchLastY
  const dtm = Math.max((now - touchLastT) / 1000, 0.016)
  if (!mobHSwiping && Math.abs(t.clientY - touchStartY) > 8) { mobHSwiping = true; paused = false; pendingConfirmIdx = null; notifyRingDrag(true) }
  if (mobHSwiping) {
    angle += dy * MOB_TOUCH_SENS
    touchVel = touchVel * 0.6 + (dy / dtm) * 0.4
  }
  touchLastY = t.clientY; touchLastT = now
}, { passive: false })
renderer.domElement.addEventListener('touchend', (e) => {
  clearHeldTrace()
  if (!isMobile || storyOpen) return
  if (mobHSwiping) notifyRingDrag(false)
  dragging = false
  if (!mobHSwiping) {
    const t = e.changedTouches[0]
    clickPointer.x = (t.clientX / innerWidth) * 2 - 1
    clickPointer.y = -((t.clientY / viewportH()) * 2 - 1)
    raycaster.setFromCamera(clickPointer, camera)
    const hits = raycaster.intersectObjects(panels, false)
    if (welcomeActive) { handleWelcomeClick(hits); touchId = null; return }
    if (hits.length > 0) { paused = true; handlePanelClick(frontPanelIdx()) }
  } else {
    angVel = Math.max(-MAX_VEL, Math.min(MAX_VEL, touchVel * MOB_TOUCH_SENS))
  }
  touchId = null
}, { passive: true })
renderer.domElement.addEventListener('touchcancel', clearHeldTrace, { passive: true })

// Wheel events fire continuously through a scroll gesture with no natural
// start/end like pointerdown/up — debounce so the piano gets one "started"
// per burst and one "stopped" after scrolling actually pauses.
let wheelDragTimeout = null
window.addEventListener('wheel', (e) => {
  if (storyOpen || welcomeActive) return
  e.preventDefault()
  angle -= e.deltaY * 0.0008
  angVel = 0
  if (!wheelDragTimeout) notifyRingDrag(true)
  clearTimeout(wheelDragTimeout)
  wheelDragTimeout = setTimeout(() => { notifyRingDrag(false); wheelDragTimeout = null }, 220)
}, { passive: false })

window.addEventListener('keydown', (e) => {
  if (storyOpen || welcomeActive) return
  if (e.key === 'ArrowLeft')       angVel = Math.min(MAX_VEL, angVel + 1.8)
  else if (e.key === 'ArrowRight') angVel = Math.max(-MAX_VEL, angVel - 1.8)
})
window.addEventListener('message', (e) => {
  if (storyOpen || welcomeActive) return
  if (!e.data || e.data.type !== 'key') return
  if (e.data.key === 'ArrowLeft')       angVel = Math.min(MAX_VEL, angVel + 1.8)
  else if (e.data.key === 'ArrowRight') angVel = Math.max(-MAX_VEL, angVel - 1.8)
})

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / viewportH()
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, viewportH())
  updateStoryRect()
})

// ── Render loop ───────────────────────────────────────────────────────────────
let last = performance.now()

// The animated card faces (moving-images water/caustic + archive video) redraw
// every frame so their motion stays smooth. The per-frame cost is kept low by
// pre-baking the grayscale swim tile once (see buildSwimGray) instead of running
// a canvas filter on every tile of every frame, which is what used to stutter
// the ring while spinning.
let prFrames = 0, prAccum = 0
function render(now) {
  requestAnimationFrame(render)
  let dt = (now - last) / 1000; last = now
  if (dt > 0.05) dt = 0.05

  // Twice a second, if we're below ~56fps, shed a quarter step of pixel ratio
  // (down to 0.75) so the ring recovers when the GPU throttles under sustained
  // load. Only steps down, so it settles without oscillating. Checking twice a
  // second lets it react to a thermal drop within ~half a second.
  prFrames++; prAccum += dt
  if (prAccum >= 0.5) {
    const fps = prFrames / prAccum
    prFrames = 0; prAccum = 0
    if (fps < 56 && curPR > 0.75) {
      curPR = Math.max(0.75, curPR - 0.25)
      renderer.setPixelRatio(curPR)
      renderer.setSize(innerWidth, viewportH())
    }
  }

  // Only rebuild + re-upload the two animated card textures (moving-images
  // caustics, archive video) while the card is in the visible front arc. When a
  // card is rotated to the back of the ring its animation can't be read anyway,
  // so redrawing it there was pure sustained GPU load — the thing that heats the
  // machine and makes it studder ~10-15s in. Phase (swimTime/swimScroll) still
  // advances every frame, so there's no jump when a card swings back into view.
  const visThresh = -(isMobile ? MOB_RADIUS : RADIUS) * 0.2   // front ~60% of the ring
  const miVisible = !panels[MOVING_IMAGES_INDEX] || panels[MOVING_IMAGES_INDEX].position.z > visThresh
  const arVisible = !panels[ARCHIVE_INDEX] || panels[ARCHIVE_INDEX].position.z > visThresh

  if (movingImagesFaceTex && swimImg.complete && swimImg.naturalWidth) {
    swimScroll += SWIM_SCROLL_SPEED * dt
    swimTime += dt
    if (miVisible) {
      drawPortalCard(movingImagesFaceCtx, PORTALS[MOVING_IMAGES_INDEX], 600, 800, 54,
        (ctx, W, H) => drawSwimTrace(ctx, W, H, PORTALS[MOVING_IMAGES_INDEX]?.bg, 1.0))
      movingImagesFaceTex.needsUpdate = true
    }
  }

  if (arVisible && archiveFaceTex && archiveVideo.readyState >= 2) {
    drawPortalCard(archiveFaceCtx, PORTALS[ARCHIVE_INDEX], 600, 800, 54,
      (ctx, W, H) => drawArchiveVideo(ctx, W, H))
    archiveFaceTex.needsUpdate = true
  }

  if (!dragging && !storyOpen && !welcomeActive) {
    if (!paused) {
      const target = AUTO_SPEED
      angVel = target + (angVel - target) * Math.exp(-FRICTION * dt)
    } else {
      angVel *= Math.exp(-FRICTION * dt)
    }
    angle += angVel * dt
  }

  // While the pointer is down (holding or dragging), keep the front-most panel
  // fully opaque so it stays solid as you spin through the ring; released → revert.
  if (dragging) setHeldTrace(frontPanelIdx())

  if (isMobile) {
    orbitEuler.set(angle, 0, 0, 'XYZ')
    orbitQuat.setFromEuler(orbitEuler)

    for (let i = 0; i < COUNT; i++) {
      orbitPos.copy(homePositions[i]).applyQuaternion(orbitQuat)
      panels[i].position.set(0, orbitPos.y * SPREAD, orbitPos.z)
      panels[i].rotation.set(Math.atan2(-orbitPos.y, orbitPos.z), 0, 0)

      const norm = Math.min(1, Math.max(0, (orbitPos.z + MOB_RADIUS) / (2 * MOB_RADIUS)))
      faceMats[i].opacity  = FRONT_OPACITY * (0.5 + 0.5 * norm)
      glassMats[i].opacity = BACK_OPACITY  * (0.3 + 0.7 * norm)
      sideMats[i].opacity  = 0.65 * (0.22 + 0.45 * norm)
      backMats[i].opacity  = 0.72
      // Held card (Detroit/Postcards full-colour reveal) goes fully solid —
      // no glass/back translucency, so nothing behind it reads through.
      if (i === heldTraceIdx) {
        faceMats[i].opacity = 1; glassMats[i].opacity = 1
        sideMats[i].opacity = 1; backMats[i].opacity = 1
      }
      if (welcomeActive && i === WELCOME_INDEX) {
        faceMats[i].opacity = 1; glassMats[i].opacity = 1
        sideMats[i].opacity = 1; backMats[i].opacity = 1
      }
      panels[i].renderOrder = Math.round(orbitPos.z * 1000)
    }
  } else {
    orbitEuler.set(0, angle, 0, 'XYZ')
    orbitQuat.setFromEuler(orbitEuler)

    for (let i = 0; i < COUNT; i++) {
      orbitPos.copy(homePositions[i]).applyQuaternion(orbitQuat)
      panels[i].position.set(orbitPos.x * SPREAD, 0, orbitPos.z)
      panels[i].rotation.set(0, Math.atan2(orbitPos.x, orbitPos.z), 0)

      const norm = Math.min(1, Math.max(0, (orbitPos.z + RADIUS) / (2 * RADIUS)))
      faceMats[i].opacity  = FRONT_OPACITY * (0.5 + 0.5 * norm)
      glassMats[i].opacity = BACK_OPACITY  * (0.3 + 0.7 * norm)
      sideMats[i].opacity  = 0.65 * (0.22 + 0.45 * norm)
      backMats[i].opacity  = 0.72
      if (i === heldTraceIdx) {
        faceMats[i].opacity = 1; glassMats[i].opacity = 1
        sideMats[i].opacity = 1; backMats[i].opacity = 1
      }
      if (welcomeActive && i === WELCOME_INDEX) {
        faceMats[i].opacity = 1; glassMats[i].opacity = 1
        sideMats[i].opacity = 1; backMats[i].opacity = 1
      }
      panels[i].renderOrder = Math.round(orbitPos.z * 1000)
    }
  }

  if (storyOpen) updateStoryRect()

  renderer.render(scene, camera)
}

requestAnimationFrame(render)
</script>

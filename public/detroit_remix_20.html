<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>detroit — cityscape</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0806; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; }
  #hud { position: fixed; left: 28px; bottom: 82px; z-index: 20;
         font: 400 11px/1.7 'Helvetica Neue', Helvetica, Arial, sans-serif;
         letter-spacing: 0.2em; color: rgba(255,255,255,0.5); pointer-events: none; }
  #freeze { position: fixed; left: 28px; bottom: 28px; z-index: 20;
    font: 500 15px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: 0.34em; text-transform: uppercase; padding: 15px 26px;
    background: none; cursor: pointer; color: #FF2D95; border: 1px solid #FF2D95;
    text-shadow: 0 0 10px #FF2D95; box-shadow: 0 0 14px rgba(255,45,149,0.5), inset 0 0 14px rgba(255,45,149,0.18); }
  #freeze.go { color: #2BFF88; border-color: #2BFF88; text-shadow: 0 0 10px #2BFF88;
    box-shadow: 0 0 14px rgba(43,255,136,0.5), inset 0 0 14px rgba(43,255,136,0.18); }
  #opts { position: fixed; right: 28px; bottom: 28px; z-index: 20; display: flex; gap: 10px; }
  #opts button { font: 500 11px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 14px; background: none;
    border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.55); cursor: pointer; }
  #opts button.on { color: #FAFF00; border-color: #FAFF00; text-shadow: 0 0 8px #FAFF00; }
  #begin { position: fixed; inset: 0; z-index: 40; background: #0c0806;
           display: flex; align-items: center; justify-content: center; }
  #begin button { font: 500 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: 0.34em; text-transform: uppercase; color: rgba(255,200,140,0.85);
    padding: 16px 34px; border: 1px solid rgba(255,200,140,0.28); background: none; cursor: pointer; }
</style>
</head>
<body>
<div id="hud"></div>
<button id="freeze">Freeze</button>
<div id="opts">
  <button data-ms="420">Slow</button>
  <button data-ms="240" class="on">Fluid</button>
  <button data-ms="120">Fast</button>
</div>
<div id="begin"><button>Run</button></div>
<script src="/vendor/three.min.js"></script>
<script>
// One-point perspective. Every square extrudes into the distance toward a
// single vanishing point off the outer right.
//
// The previous card gave the squares thickness and then swayed the camera to
// show it, which meant the depth kept changing direction. Here the camera never
// moves. Instead every box is a PRISM pointing along one shared direction —
// back, right, and slightly up — and because they are all parallel they
// converge on one point, the way a street of buildings does.
//
// The construction that makes it work: a box's front face stays exactly where
// its square was, in the picture plane, and the prism grows BACKWARD from there.
// So the portrait is still intact when you look at the front of it, and the
// depth is entirely in what recedes behind. Extruding around the square's centre
// instead — the obvious way — pushed half of every prism forward through the
// picture plane and broke the face into a thicket.
//
// Every prism reaches the horizon. Luminance only varies how far, by a fifth
// either way, so the skyline has relief without gaps torn in it.
//
//   ?vpx=0.45     how far right the vanishing point sits (0 = straight back)
//   ?vpy=0.10     and how far up
//   ?reach=17     how far the prisms run toward the horizon
//   ?sat=1.75     colour saturation boost
//   ?chunk=22     square size in composite pixels
//   ?shift=0.05   how far a prism's foot travels between arrangements
//   ?ms=240       milliseconds per arrangement
//   ?versions=100 arrangements in the loop
//   ?seed=123     reproduce a particular run

const q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? v : d; };

const SRC      = q.get('src') || '/detroit/32.webp';
const RW = 300, RH = 388, U = 100;            // composite px, and px per world unit
const CHUNK    = Math.max(4, Math.round(num('chunk', 22)));
const SHIFT    = num('shift', 0.05);
const VPX      = num('vpx', 0.45);
const VPY      = num('vpy', 0.10);
// Every prism runs to the horizon. Luminance no longer decides whether a square
// leaves the plane, only how much further than its neighbours it goes — the
// short dark ones were leaving holes in a skyline that should be continuous.
const REACH    = num('reach', 17);
const SAT      = num('sat', 1.75);
const VERSIONS = Math.max(2, Math.round(num('versions', 100)));

const UNDER    = q.get('under') || 'none';
const SEED     = (() => { const v = parseInt(q.get('seed'), 10);
                          return Number.isFinite(v) ? v : (Math.random() * 1e9) | 0; })();
let STEP_MS    = Math.max(16, num('ms', 240));


const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0c0806');
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);

// Lit from the front-left and filled from behind, so a box's own sides separate
// from its face. A single flat light would have left every box reading as the
// coloured rectangle it already was.
scene.add(new THREE.AmbientLight(0xffffff, 0.34));   // was 0.55: ambient white was itself washing the colour out
const key = new THREE.DirectionalLight(0xffffff, 0.92); key.position.set(-3, 4, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.35); rim.position.set(4, -2, -3); scene.add(rim);

let CELLS = [], OFFSETS = [], mesh = null, plane = null;
const dummy = new THREE.Object3D();

// One direction for every prism. Parallel lines converge at the projection of
// their direction, so vpx/vpy ARE the vanishing point in tangent units: at 0.45
// against a half-frame of about 0.31 it sits just outside the right edge, which
// is what makes the recession feel like it continues past the picture rather
// than terminating inside it.
const DIR = new THREE.Vector3(VPX, VPY, -1).normalize();
const ALIGN = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), DIR);

function dominantAndLuma(d, W, sx, sy, sw, sh) {
  const bins = new Map();
  let best = 0, bestKey = -1, lum = 0, n = 0;
  for (let y = sy; y < sy + sh; y++) {
    let i = (y * W + sx) * 4;
    for (let x = 0; x < sw; x++, i += 4) {
      const key = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3);
      const c = (bins.get(key) || 0) + 1;
      bins.set(key, c);
      if (c > best) { best = c; bestKey = key; }
      lum += (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114); n++;
    }
  }
  const r = ((bestKey >> 10) & 31) << 3, g = ((bestKey >> 5) & 31) << 3, b = (bestKey & 31) << 3;
  return { r: r / 255, g: g / 255, b: b / 255, luma: n ? lum / n / 255 : 0 };
}

function build(img) {
  const c = document.createElement('canvas'); c.width = RW; c.height = RH;
  const x = c.getContext('2d');
  const s = Math.max(RW / img.width, RH / img.height);
  const dw = img.width * s, dh = img.height * s;
  x.drawImage(img, (RW - dw) / 2, (RH - dh) / 2, dw, dh);
  const d = x.getImageData(0, 0, RW, RH).data;

  const cols = Math.ceil(RW / CHUNK), rows = Math.ceil(RH / CHUNK);
  CELLS = [];
  for (let r = 0; r < rows; r++) for (let cc = 0; cc < cols; cc++) {
    const sx = cc * CHUNK, sy = r * CHUNK;
    const sw = Math.min(CHUNK, RW - sx), sh = Math.min(CHUNK, RH - sy);
    if (sw <= 0 || sh <= 0) continue;
    const col = dominantAndLuma(d, RW, sx, sy, sw, sh);
    CELLS.push({
      len: REACH * (0.80 + 0.20 * col.luma),
      // world position of the square's centre, y flipped: canvas counts down,
      // three counts up, and a portrait upside down is a hard bug to miss but
      // an easy one to write.
      x: (sx + sw / 2 - RW / 2) / U,
      y: -(sy + sh / 2 - RH / 2) / U,
      w: sw / U, h: sh / U, col,
    });
  }

  OFFSETS = [];
  for (let v = 0; v < VERSIONS; v++) {
    let st = ((SEED ^ (v * 2654435761)) >>> 0) || 1;
    const rand = () => { st ^= st << 13; st >>>= 0; st ^= st >> 17; st ^= st << 5; st >>>= 0;
                         return st / 4294967296; };
    const mx = (RW * SHIFT) / U, my = (RH * SHIFT) / U;
    // Only the foot moves, and only in the picture plane. Letting the prisms
    // drift in depth as well broke the shared vanishing point, which is the
    // one thing this version exists to hold.
    OFFSETS.push(CELLS.map(() => ({
      dx: (rand() * 2 - 1) * mx,
      dy: (rand() * 2 - 1) * my,
    })));
  }

  mesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ roughness: 0.62, metalness: 0.04 }),
    CELLS.length);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  // Two things were flattening the colour. setRGB feeds raw values in as LINEAR,
  // and with outputEncoding sRGB three then brightens them again on the way out
  // — every colour came back lighter and chalkier than the pixel it came from.
  // convertSRGBToLinear undoes that. Then the saturation is pushed, because a
  // dominant colour averaged out of a photograph is duller than the thing a
  // viewer remembers seeing.
  const col = new THREE.Color();
  const hsl = {};
  CELLS.forEach((c, i) => {
    col.setRGB(c.col.r, c.col.g, c.col.b);
    col.getHSL(hsl);
    col.setHSL(hsl.h, Math.min(1, hsl.s * SAT), hsl.l);
    col.convertSRGBToLinear();
    mesh.setColorAt(i, col);
  });
  mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);

  if (UNDER !== 'none') {
    const mat = UNDER === 'image'
      ? new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) })
      : new THREE.MeshBasicMaterial({ color: '#' + UNDER.replace('#', '') });
    if (mat.map) mat.map.encoding = THREE.sRGBEncoding;
    plane = new THREE.Mesh(new THREE.PlaneGeometry(RW / U, RH / U), mat);
    plane.position.z = -DEPTH * 0.8;
    scene.add(plane);
  }

  // Frame the whole card with a little air, whatever the viewport shape.
  const fit = () => {
    const h = RH / U, w = RW / U;
    const vFov = camera.fov * Math.PI / 180;
    const dH = (h / 2) / Math.tan(vFov / 2);
    const dW = (w / 2) / Math.tan(vFov / 2) / camera.aspect;
    camera.position.set(0, 0, Math.max(dH, dW) * 1.30);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
  };
  fit(); window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; renderer.setSize(innerWidth, innerHeight); fit();
  });
}

let frozen = false, running = false, t0 = 0, held = 0, cursor = 0;
const smooth = (t) => t * t * (3 - 2 * t);

function update(mix, a, b) {
  const A = OFFSETS[a], B = OFFSETS[b];
  for (let i = 0; i < CELLS.length; i++) {
    const c = CELLS[i];
    const dx = A[i].dx + (B[i].dx - A[i].dx) * mix;
    const dy = A[i].dy + (B[i].dy - A[i].dy) * mix;
    // Front face pinned to the picture plane, prism grown backward along DIR:
    // hence the half-length offset rather than sitting the box on its square.
    dummy.position.set(c.x + dx + DIR.x * c.len / 2,
                       c.y + dy + DIR.y * c.len / 2,
                       DIR.z * c.len / 2);
    dummy.quaternion.copy(ALIGN);
    dummy.scale.set(c.w, c.h, c.len);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!running || !mesh) return;
  if (frozen) t0 = now - held;
  const steps = (now - t0) / STEP_MS;
  cursor = Math.floor(steps) % VERSIONS;
  let mix = steps - Math.floor(steps);
  update(smooth(mix), cursor, (cursor + 1) % VERSIONS);
  renderer.render(scene, camera);
  hud.textContent = String(cursor + 1).padStart(3, '0') + ' / ' + VERSIONS
                  + '   ·   ' + CELLS.length + ' PRISMS   ·   ' + Math.round(STEP_MS) + 'MS';
}

const hud = document.getElementById('hud');
const freezeBtn = document.getElementById('freeze');
freezeBtn.addEventListener('click', () => {
  frozen = !frozen;
  freezeBtn.textContent = frozen ? 'Go' : 'Freeze';
  freezeBtn.classList.toggle('go', frozen);
  if (frozen) held = performance.now() - t0;
});
document.querySelectorAll('#opts button[data-ms]').forEach((b) => {
  b.addEventListener('click', () => {
    const now = performance.now(), steps = (now - t0) / STEP_MS;
    STEP_MS = parseFloat(b.dataset.ms);
    t0 = now - steps * STEP_MS;
    document.querySelectorAll('#opts button[data-ms]').forEach((o) => o.classList.remove('on'));
    b.classList.add('on');
  });
});


const img = new Image();
img.onload = () => { build(img); requestAnimationFrame(frame); };
img.src = SRC;

document.querySelector('#begin button').addEventListener('click', () => {
  document.getElementById('begin').style.display = 'none';
  t0 = performance.now(); running = true;
});
</script>
</body>
</html>

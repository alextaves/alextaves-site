<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>alextaves — fiction</title>
<link href="/vendor/fonts/ibm-plex.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0c0806; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }

  .story-overlay {
    --bg: #C9A400; --bg-r: 201; --bg-g: 164; --bg-b: 0;
    position: fixed; z-index: 50;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.035) 0px, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 3px),
      rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.9);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    opacity: 0; pointer-events: none;
    transition: opacity 400ms ease;
    overflow-y: auto; overflow-x: hidden;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow:
      0 0 90px 18px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.4),
      0 25px 80px rgba(0, 0, 0, 0.7);
  }
  .story-overlay.active {
    opacity: 1; pointer-events: auto;
    animation: storyGlow 5s ease-in-out infinite;
  }
  @keyframes storyGlow {
    0%, 100% { box-shadow: 0 0 90px 18px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.4), 0 25px 80px rgba(0, 0, 0, 0.7); }
    50%      { box-shadow: 0 0 130px 30px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.6), 0 25px 80px rgba(0, 0, 0, 0.7); }
  }
  .story-text {
    padding: 7% 8% 10%;
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    color: #000;
  }
  .story-text::after { content: ''; display: table; clear: both; }
  /* Exact duplicate of the portal card's typed neon title — same face, size
     and type/backspace cadence (see makeTypedOverlay) — but in black ink and
     floated so the prose wraps around it like a headline. */
  .story-cover-title {
    float: left;
    width: 44%;
    margin: 0 1.6em 1em 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-size: 2.3em;
    line-height: 1.14;
    color: #000;
  }
  .story-cover-title .line { min-height: 1.14em; }
  .story-cover-title .line.cursor-on::after {
    content: '';
    display: inline-block;
    width: 0.06em; height: 0.85em;
    background: #000;
    margin-left: 0.05em;
    vertical-align: -0.08em;
  }
  .story-body p {
    letter-spacing: 0.01em;
    font-size: 1.05em; line-height: 1.85; margin: 0 0 1.2em;
  }
  .story-body .typing::after {
    content: '▋'; color: #000; margin-left: 0.12em;
    animation: caretBlink 0.9s steps(1) infinite;
  }
  @keyframes caretBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="story-overlay" id="storyOverlay">
  <div class="story-text" id="storyText">
    <div class="story-cover-title" id="storyCoverTitle">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="story-body" id="storyBody"></div>
  </div>
</div>
<script src="/vendor/three.min.js"></script>
<script>
const HUM_INDEX = 0
const ELON_INDEX = 1
const SIPHON_INDEX = 2
const KNIFE_INDEX = 3
const PORTALS = [
  { title: 'HUM',       sub: 'broken sign',      bg: '#0c0c0c', light: true  },
  { title: "ELON'S IN MY ELEVATOR", sub: 'floor 41', bg: '#1a1a1a', light: true },
  { title: 'SIPHON',    sub: 'falling dots',      bg: '#05061a', light: true  },
  { title: 'KNIFE',     sub: 'casual knife fight', bg: '#C9A400', light: true  },
  { title: 'GRAFTING',  sub: 'coming soon',       bg: '#046A38', light: true  },
  { title: 'BOOGIE',    sub: 'coming soon',       bg: '#582C83', light: true  },
  { title: 'CBC',       sub: 'coming soon',       bg: '#E4002B', light: true  },
  { title: 'DORTHY SOTHERBY', sub: 'coming soon', bg: '#F37021', light: true  },
]
const COUNT = PORTALS.length

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene()
const bgC = document.createElement('canvas'); bgC.width = 4; bgC.height = 512
const bgCtx = bgC.getContext('2d')
const bgG = bgCtx.createLinearGradient(0, 0, 0, 512)
bgG.addColorStop(0, '#16110d'); bgG.addColorStop(1, '#0a0704')
bgCtx.fillStyle = bgG; bgCtx.fillRect(0, 0, 4, 512)
const bgTex = new THREE.CanvasTexture(bgC); bgTex.encoding = THREE.sRGBEncoding
scene.background = bgTex
scene.fog = new THREE.Fog('#0e0b08', 8, 50)

// Touch-capability detection (ontouchstart/maxTouchPoints) is unreliable on
// Chrome for iOS specifically — it's a WKWebView wrapper, not Safari's native
// engine plumbing, and has been observed reporting no touch support at all,
// which silently forced the desktop ring code path on an actual phone no
// matter what the page's own site-mode setting was. Viewport width alone is
// a sufficient, more robust signal for "this is a phone/small tablet".
const isMobile = innerWidth < 1024
const RADIUS    = 6.0
const CAM_Z     = 10.0
const MOB_CAM_Z = 2.5
// Mobile ring radius must stay smaller than MOB_CAM_Z so the camera sits
// outside the ring looking in (same relationship desktop has: CAM_Z > RADIUS).
// Using the desktop RADIUS here put the camera *inside* the ring on mobile,
// which is what caused panels to flip/invert as they crossed behind it.
const MOB_RADIUS = 1.5

// Mobile browsers can report a taller innerHeight at load than what's
// actually settled/visible once the address bar finishes animating, and
// visualViewport.height turned out to disagree between Safari and Chrome on
// the same device (fixed cropping in one, not the other). CSS `svh` (small
// viewport height) is the standards-based fix: it's a WebKit-engine-level
// primitive guaranteed to reflect the height visible with the toolbar fully
// expanded, so it behaves consistently across browser apps sharing that
// engine. Desktop is untouched (falls through to plain innerHeight).
const svhProbe = document.createElement('div')
svhProbe.style.cssText = 'position:fixed; top:0; left:0; height:100svh; width:0; visibility:hidden; pointer-events:none;'
document.body.appendChild(svhProbe)
const viewportH = () => {
  if (!isMobile) return innerHeight
  const svh = svhProbe.getBoundingClientRect().height
  const vv = window.visualViewport ? window.visualViewport.height : innerHeight
  return svh > 0 ? Math.min(svh, innerHeight) : Math.min(innerHeight, vv)
}

const camera = new THREE.PerspectiveCamera(55, innerWidth / viewportH(), 0.1, 200)
camera.position.set(0, 0, isMobile ? MOB_CAM_Z : CAM_Z)
camera.lookAt(0, 0, 0)

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
renderer.setSize(innerWidth, viewportH())
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.outputEncoding = THREE.sRGBEncoding
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
document.body.appendChild(renderer.domElement)

// ── Typed neon title overlay, shared by video and image covers ────────────────
// `text` may be a single word or an array of lines (typed in reading order,
// filling each line before moving to the next).
function makeTypedOverlay(text, neonColor, opts) {
  const lines = Array.isArray(text) ? text : [text]
  const totalLen = lines.reduce((n, l) => n + l.length, 0)
  const o = opts || {}
  const TYPE_DUR = o.typeDur || 750
  const BACKSPACE_DUR = o.backspaceDur || 750
  const CYCLE = o.cycle || 5000
  const LINE_HEIGHT = 84

  const overlayCanvas = document.createElement('canvas')
  overlayCanvas.width = 600; overlayCanvas.height = 800
  const overlayCtx = overlayCanvas.getContext('2d')
  const overlayTex = new THREE.CanvasTexture(overlayCanvas)
  overlayTex.encoding = THREE.sRGBEncoding

  let lastState = ''
  function drawOverlay(now) {
    const t = now % CYCLE
    let charCount
    if (t < TYPE_DUR) {
      charCount = Math.min(totalLen, Math.floor((t / TYPE_DUR) * (totalLen + 1)))
    } else if (t > CYCLE - BACKSPACE_DUR) {
      const bt = t - (CYCLE - BACKSPACE_DUR)
      charCount = totalLen - Math.min(totalLen, Math.floor((bt / BACKSPACE_DUR) * (totalLen + 1)))
    } else {
      charCount = totalLen
    }
    const cursorOn = Math.floor(now / 375) % 2 === 0
    const state = charCount + ':' + cursorOn
    if (state === lastState) return
    lastState = state

    let remaining = charCount
    const shownLines = lines.map(line => {
      const take = Math.max(0, Math.min(line.length, remaining))
      remaining -= take
      return line.slice(0, take)
    })
    let activeIdx = 0
    shownLines.forEach((s, i) => { if (s.length > 0) activeIdx = i })

    overlayCtx.clearRect(0, 0, 600, 800)
    overlayCtx.textAlign = 'left'; overlayCtx.textBaseline = 'alphabetic'
    overlayCtx.font = "700 74px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    overlayCtx.letterSpacing = '-0.01em'
    overlayCtx.shadowColor = neonColor
    overlayCtx.shadowBlur = 22
    overlayCtx.fillStyle = neonColor
    shownLines.forEach((s, i) => {
      if (s.length > 0) overlayCtx.fillText(s, 54, 132 + i * LINE_HEIGHT)
    })

    if (cursorOn) {
      const activeText = shownLines[activeIdx]
      const w = overlayCtx.measureText(activeText).width
      const y = 132 + activeIdx * LINE_HEIGHT
      overlayCtx.fillRect(54 + w + 4, y - 62, 6, 70)
    }
    overlayTex.needsUpdate = true
  }

  return { overlayTex, drawOverlay }
}

// ── Special portal covers — a recording of the finished standalone artwork,
// played as a native video texture, with its name typed out over top in neon.
// Videos never attached to the document tree have been observed to silently
// fail to autoplay as a WebGL texture source on iOS WebKit (Safari and
// Chrome-iOS share the same engine there), even when muted+playsinline+
// autoplay are all set correctly — desktop Chrome is lenient about this,
// which is why it worked in every desktop/emulated check. Keeping the
// element in the DOM (invisibly) and retrying play() once data has actually
// loaded, plus once more on the visitor's first touch, makes this reliable.
const allCoverVideos = []
function makeVideoCover(src, text, neonColor, opts) {
  const video = document.createElement('video')
  video.src = src
  video.muted = true
  video.loop = true
  video.playsInline = true
  video.setAttribute('webkit-playsinline', '')
  video.autoplay = true
  video.style.cssText = 'position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0.01; pointer-events:none;'
  document.body.appendChild(video)
  allCoverVideos.push(video)
  video.play().catch(() => {})
  video.addEventListener('loadeddata', () => video.play().catch(() => {}))
  const videoTex = new THREE.VideoTexture(video)
  videoTex.encoding = THREE.sRGBEncoding
  videoTex.minFilter = THREE.LinearFilter
  videoTex.magFilter = THREE.LinearFilter

  // mirrored copy for the back face — same live <video>, just horizontally flipped
  const videoTexBack = new THREE.VideoTexture(video)
  videoTexBack.encoding = THREE.sRGBEncoding
  videoTexBack.minFilter = THREE.LinearFilter
  videoTexBack.magFilter = THREE.LinearFilter
  videoTexBack.wrapS = THREE.RepeatWrapping
  videoTexBack.repeat.x = -1

  const { overlayTex, drawOverlay } = makeTypedOverlay(text, neonColor, opts)

  return { videoTex, videoTexBack, overlayTex, drawOverlay, meshRef: null }
}

// ── Fuzzy-TV static layer — subtle grayscale noise with occasional brief
// glitch tears. Sits above the image, below the text overlay.
function makeStaticOverlay(opts) {
  const o = opts || {}
  const W = 160, H = 213
  const canvas = document.createElement('canvas')
  canvas.width = W; canvas.height = H
  const ctx = canvas.getContext('2d')
  const tex = new THREE.CanvasTexture(canvas)
  tex.encoding = THREE.sRGBEncoding

  const imgData = ctx.createImageData(W, H)
  const baseAlpha = o.alpha ?? 55
  const FRAME_INTERVAL = 1000 / 12
  let lastDraw = 0
  let nextGlitchAt = performance.now() + 1500 + Math.random() * 3000
  let glitchUntil = 0

  function drawStatic(now) {
    if (now - lastDraw < FRAME_INTERVAL) return
    lastDraw = now

    const inGlitch = now < glitchUntil
    if (!inGlitch && now > nextGlitchAt) {
      glitchUntil = now + 80 + Math.random() * 140
      nextGlitchAt = now + 2500 + Math.random() * 4500
    }

    const data = imgData.data
    const alpha = inGlitch ? baseAlpha * 2.5 : baseAlpha
    for (let i = 0; i < data.length; i += 4) {
      const v = (Math.random() * 255) | 0
      data[i] = v; data[i + 1] = v; data[i + 2] = v; data[i + 3] = alpha
    }
    ctx.putImageData(imgData, 0, 0)

    if (inGlitch) {
      const bandH = 4 + ((Math.random() * 10) | 0)
      const bandY = (Math.random() * (H - bandH)) | 0
      const shift = (Math.random() > 0.5 ? 1 : -1) * (4 + ((Math.random() * 10) | 0))
      ctx.drawImage(canvas, 0, bandY, W, bandH, shift, bandY, W, bandH)
    }

    tex.needsUpdate = true
  }

  return { tex, drawStatic }
}

// ── Static image cover — same treatment as makeVideoCover, but for a still
// image. The image is cropped (cover-fit) to the portrait panel aspect so it
// fills the full panel height with the sides trimmed off.
function makeImageCover(src, text, neonColor, opts) {
  const W = 600, H = 800
  const frontCanvas = document.createElement('canvas')
  frontCanvas.width = W; frontCanvas.height = H
  const frontCtx = frontCanvas.getContext('2d')
  const imageTex = new THREE.CanvasTexture(frontCanvas)
  imageTex.encoding = THREE.sRGBEncoding

  const backCanvas = document.createElement('canvas')
  backCanvas.width = W; backCanvas.height = H
  const backCtx = backCanvas.getContext('2d')
  const imageTexBack = new THREE.CanvasTexture(backCanvas)
  imageTexBack.encoding = THREE.sRGBEncoding

  const img = new Image()
  img.onload = () => {
    const scale = Math.max(W / img.width, H / img.height)
    const dw = img.width * scale, dh = img.height * scale
    const dx = (W - dw) / 2, dy = (H - dh) / 2
    frontCtx.drawImage(img, dx, dy, dw, dh)
    imageTex.needsUpdate = true

    backCtx.translate(W, 0); backCtx.scale(-1, 1)
    backCtx.drawImage(frontCanvas, 0, 0)
    imageTexBack.needsUpdate = true
  }
  img.src = src

  const { overlayTex, drawOverlay: drawTextOverlay } = makeTypedOverlay(text, neonColor, opts)

  let staticTex = null, drawStatic = null
  if (opts && opts.static) {
    const s = makeStaticOverlay(opts.staticOpts)
    staticTex = s.tex
    drawStatic = s.drawStatic
  }

  function drawOverlay(now) {
    drawTextOverlay(now)
    if (drawStatic) drawStatic(now)
  }

  return { videoTex: imageTex, videoTexBack: imageTexBack, overlayTex, staticTex, drawOverlay, meshRef: null }
}

const humCover = makeVideoCover('/hum_cover.mp4', 'HUM', '#FF14C0')
const siphonCover = makeVideoCover('/siphon_cover.mp4', 'SIPHON', '#F5FF00')
const knifeCover = makeVideoCover('/knife_cover.mp4', ['CASUAL', 'KNIFE', 'FIGHT'], '#CCFF00', { typeDur: 1600, backspaceDur: 1600, cycle: 6200 })
const elonCover = makeImageCover('/elon.webp', ["ELON'S", 'IN MY', 'ELEVATOR'], '#FFFFFF', { typeDur: 1600, backspaceDur: 1600, cycle: 6200, static: true })

// Belt-and-braces: retry any cover video that's still paused on the
// visitor's first touch/click, since that's a guaranteed user gesture and
// clears up any autoplay policy edge case the loadeddata retry above missed.
function retryStalledCoverVideos() {
  allCoverVideos.forEach(v => { if (v.paused) v.play().catch(() => {}) })
}
window.addEventListener('touchstart', retryStalledCoverVideos, { once: true, passive: true })
window.addEventListener('pointerdown', retryStalledCoverVideos, { once: true })

// ── Environment ───────────────────────────────────────────────────────────────
const envScene = new THREE.Scene()
envScene.background = new THREE.Color('#0e0b08')
;[
  [0, 8, 0, 8, 8, 1.6], [6, 2, 0, 4, 8, 0.02],
  [-6, 2, 0, 4, 8, 0.02], [0, -6, 0, 12, 12, 0.0],
].forEach(([x, y, z, w, h, b]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(b) }))
  m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m)
})
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(envScene, 0, 0.1, 200).texture
scene.add(new THREE.HemisphereLight('#2a1a0a', '#0e0806', 0.15))
const key = new THREE.DirectionalLight('#ffffff', 1.1); key.position.set(4, 6, 5)
const rim = new THREE.DirectionalLight('#ffcf90', 0.5); rim.position.set(-5, 2, -4)
scene.add(key, rim)

// ── Panel geometry ────────────────────────────────────────────────────────────
const nearDist    = CAM_Z - RADIUS
const mobNearDist = MOB_CAM_Z - MOB_RADIUS
const vFOV = (camera.fov * Math.PI) / 180
let panelW, panelH
if (isMobile) {
  const hFOVhalf = Math.atan(Math.tan(vFOV / 2) * camera.aspect)
  panelW = 2 * mobNearDist * Math.tan(hFOVhalf) * 0.95
  panelH = panelW * (4 / 3)
} else {
  panelH = 0.9 * 2 * nearDist * Math.tan(vFOV / 2)
  panelW = panelH * (3 / 4)
}
// THICK is the card's physical depth in world units. Kept proportional to
// panelH (rather than a fixed absolute value) so its edge — visible as a
// dim sliver whenever a card isn't perfectly flat-on to the camera — reads
// at the same relative size on mobile as on desktop. Mobile's camera sits
// much closer to the ring (2.5 vs 10 units away), so the same absolute
// thickness used to look ~4x more prominent there.
const desktopPanelHRef = 0.9 * 2 * nearDist * Math.tan(vFOV / 2)
const THICK      = 0.16 * (panelH / desktopPanelHRef)
const REFL_FRAC  = 0.55
const FRONT_OPACITY = 0.92
const BACK_OPACITY  = 0.42
// SPREAD < 1 compresses ring position without compressing each panel's own
// facing angle (computed from the true, uncompressed geometry below) — on
// the old horizontal mobile ring that mismatch was mild, but on the vertical
// ring it crowds far more panels into the camera's view at once than the
// FOV should allow, and mismatches each one's tilt against where it's
// actually drawn. Full spread (matching desktop) avoids both problems.
const SPREAD = 1.0

// Mobile touch feel matches the desktop drag/momentum physics (SENS,
// AUTO_SPEED, MAX_VEL, FRICTION below) — same ring, same units (radians),
// just spun about the vertical axis instead of the horizontal one, and
// driven by a vertical swipe instead of a horizontal drag.
const MOB_TOUCH_SENS = 0.006
const panelGeo = new THREE.BoxGeometry(panelW, panelH, THICK)
const reflH    = panelH * REFL_FRAC
const reflGeo  = new THREE.PlaneGeometry(panelW, reflH)

// ── Alpha map ─────────────────────────────────────────────────────────────────
const roundedAlphaMap = (() => {
  const W = 128, H = Math.round(W * panelH / panelW)
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  const r = 5
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H)
  ctx.filter = 'blur(2.5px)'
  ctx.beginPath()
  ctx.moveTo(r, 0); ctx.lineTo(W - r, 0)
  ctx.arcTo(W, 0, W, r, r); ctx.lineTo(W, H - r)
  ctx.arcTo(W, H, W - r, H, r); ctx.lineTo(r, H)
  ctx.arcTo(0, H, 0, H - r, r); ctx.lineTo(0, r)
  ctx.arcTo(0, 0, r, 0, r); ctx.closePath()
  ctx.fillStyle = '#fff'; ctx.fill()
  return new THREE.CanvasTexture(c)
})()

// ── Glow reflection ───────────────────────────────────────────────────────────
function makePortalReflTex(bgHex) {
  const r = parseInt(bgHex.slice(1,3), 16)
  const g = parseInt(bgHex.slice(3,5), 16)
  const b = parseInt(bgHex.slice(5,7), 16)
  const W = 256, H = 160
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  const grd = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, W * 0.72)
  grd.addColorStop(0,    `rgba(${r},${g},${b},0.55)`)
  grd.addColorStop(0.35, `rgba(${r},${g},${b},0.22)`)
  grd.addColorStop(0.7,  `rgba(${r},${g},${b},0.06)`)
  grd.addColorStop(1,    `rgba(${r},${g},${b},0.0)`)
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H)
  const fade = ctx.createLinearGradient(0, 0, 0, H)
  fade.addColorStop(0,    'rgba(14,11,8,0.55)')
  fade.addColorStop(0.12, 'rgba(14,11,8,0.0)')
  fade.addColorStop(0.7,  'rgba(14,11,8,0.0)')
  fade.addColorStop(1,    'rgba(14,11,8,0.82)')
  ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// ── Portal card texture ───────────────────────────────────────────────────────
function makePortalTex(portal) {
  const W = 600, H = 800, lm = 54
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  ctx.fillStyle = portal.bg; ctx.fillRect(0, 0, W, H)

  const ink     = portal.light ? 'rgba(255,255,255,0.92)' : 'rgba(0,0,0,0.88)'
  const inkSub  = portal.light ? 'rgba(255,255,255,0.52)' : 'rgba(0,0,0,0.50)'
  const inkRule = portal.light ? 'rgba(255,255,255,0.30)' : 'rgba(0,0,0,0.22)'

  const maxW = W - lm * 2
  let fontSize = 74
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  do {
    ctx.font = `700 ${fontSize}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
    ctx.letterSpacing = '-0.01em'
    if (ctx.measureText(portal.title).width <= maxW) break
    fontSize -= 2
  } while (fontSize > 20)

  ctx.fillStyle = ink
  ctx.fillText(portal.title, lm, 132)

  ctx.strokeStyle = inkRule; ctx.lineWidth = 0.5
  ctx.beginPath(); ctx.moveTo(lm, 152); ctx.lineTo(W - lm, 152); ctx.stroke()

  ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
  ctx.letterSpacing = '0.16em'
  ctx.fillStyle = inkSub
  ctx.fillText(portal.sub, lm, 190)

  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; return tex
}

function makeFlippedTex(canvas) {
  const c = document.createElement('canvas')
  c.width = canvas.width; c.height = canvas.height
  const ctx = c.getContext('2d')
  ctx.translate(c.width, 0); ctx.scale(-1, 1)
  ctx.drawImage(canvas, 0, 0)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// ── Build ring (horizontal XZ plane on desktop, vertical YZ plane on mobile) ──
const orbitQuat = new THREE.Quaternion()
const orbitEuler = new THREE.Euler()
const orbitPos   = new THREE.Vector3()

const panels = [], homePositions = []
const faceMats = [], glassMats = [], backMats = [], sideMats = []
const videoCoversByIndex = { [HUM_INDEX]: humCover, [SIPHON_INDEX]: siphonCover, [KNIFE_INDEX]: knifeCover, [ELON_INDEX]: elonCover }

for (let i = 0; i < COUNT; i++) {
  const a = (i / COUNT) * Math.PI * 2
  homePositions.push(isMobile
    ? new THREE.Vector3(0, Math.sin(a) * MOB_RADIUS, Math.cos(a) * MOB_RADIUS)
    : new THREE.Vector3(Math.cos(a) * RADIUS, 0, Math.sin(a) * RADIUS))

  const faceTex  = makePortalTex(PORTALS[i])
  const backTex  = makeFlippedTex(faceTex.image)
  const panelCol = new THREE.Color(PORTALS[i].bg)
  const cover = videoCoversByIndex[i]

  const faceMat = new THREE.MeshPhysicalMaterial({
    map: cover ? cover.videoTex : faceTex, transparent: true, opacity: FRONT_OPACITY, side: THREE.FrontSide,
    roughness: 0.55, metalness: 0.0, envMapIntensity: 0.12,
    color: new THREE.Color(0xffffff), alphaMap: roundedAlphaMap,
  })
  const glassMat = new THREE.MeshStandardMaterial({
    color: panelCol, transparent: true, opacity: BACK_OPACITY,
    roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
  })
  const backMat = new THREE.MeshPhysicalMaterial({
    map: cover ? cover.videoTexBack : backTex, transparent: true, opacity: 0.72,
    roughness: 0.6, metalness: 0.0, color: new THREE.Color(0xffffff), alphaMap: roundedAlphaMap,
  })
  const sideMat = new THREE.MeshStandardMaterial({
    color: panelCol, transparent: true, opacity: 0.65,
    roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
  })
  const reflMat = new THREE.MeshBasicMaterial({
    map: makePortalReflTex(PORTALS[i].bg), transparent: true, opacity: isMobile ? 0.42 : 0.38,
  })

  const mesh = new THREE.Mesh(panelGeo, [sideMat, sideMat, glassMat, glassMat, faceMat, backMat])
  mesh.frustumCulled = false
  mesh.userData = { panelIdx: i }

  const reflMesh = new THREE.Mesh(reflGeo, reflMat)
  reflMesh.position.set(0, -(panelH + reflH) / 2, THICK / 2 + 0.002)
  reflMesh.frustumCulled = false
  mesh.add(reflMesh)

  if (cover && cover.staticTex) {
    const staticMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(panelW, panelH),
      new THREE.MeshBasicMaterial({ map: cover.staticTex, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: false })
    )
    // depthTest is off, so draw order comes entirely from renderOrder (set
    // per-frame below) — no Z-offset needed, which removes the visible
    // parallax gap between this layer and the card face at oblique angles.
    staticMesh.position.set(0, 0, THICK / 2)
    staticMesh.frustumCulled = false
    mesh.add(staticMesh)
    cover.staticMeshRef = staticMesh
  }

  if (cover) {
    const overlayMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(panelW, panelH),
      new THREE.MeshBasicMaterial({ map: cover.overlayTex, transparent: true, depthWrite: false, depthTest: false })
    )
    overlayMesh.position.set(0, 0, THICK / 2)
    overlayMesh.frustumCulled = false
    mesh.add(overlayMesh)
    cover.meshRef = overlayMesh
  }

  scene.add(mesh)
  panels.push(mesh)
  faceMats.push(faceMat); glassMats.push(glassMat)
  backMats.push(backMat); sideMats.push(sideMat)
}

const storyOverlay = document.getElementById('storyOverlay')
const storyText = document.getElementById('storyText')
const storyCoverTitle = document.getElementById('storyCoverTitle')
const storyBody = document.getElementById('storyBody')

function setStoryBg(hex) {
  storyOverlay.style.setProperty('--bg', hex)
  storyOverlay.style.setProperty('--bg-r', parseInt(hex.slice(1, 3), 16))
  storyOverlay.style.setProperty('--bg-g', parseInt(hex.slice(3, 5), 16))
  storyOverlay.style.setProperty('--bg-b', parseInt(hex.slice(5, 7), 16))
}

// Exact duplicate of makeTypedOverlay's type/backspace loop (same durations,
// same absolute-clock phase), but writing into DOM line divs instead of a
// canvas — this is the black echo of the portal card's own neon title.
function startCoverTitleLoop(lines, opts) {
  const TYPE_DUR = opts.typeDur, BACKSPACE_DUR = opts.backspaceDur, CYCLE = opts.cycle
  const totalLen = lines.reduce((n, l) => n + l.length, 0)
  const lineEls = Array.from(storyCoverTitle.children)
  let raf = null
  function frame(now) {
    const t = now % CYCLE
    let charCount
    if (t < TYPE_DUR) {
      charCount = Math.min(totalLen, Math.floor((t / TYPE_DUR) * (totalLen + 1)))
    } else if (t > CYCLE - BACKSPACE_DUR) {
      const bt = t - (CYCLE - BACKSPACE_DUR)
      charCount = totalLen - Math.min(totalLen, Math.floor((bt / BACKSPACE_DUR) * (totalLen + 1)))
    } else {
      charCount = totalLen
    }
    const cursorOn = Math.floor(now / 375) % 2 === 0
    let remaining = charCount
    let activeIdx = 0
    lines.forEach((line, i) => {
      const take = Math.max(0, Math.min(line.length, remaining))
      lineEls[i].textContent = line.slice(0, take)
      remaining -= take
      if (take > 0) activeIdx = i
    })
    lineEls.forEach((el, i) => el.classList.toggle('cursor-on', i === activeIdx && cursorOn))
    raf = requestAnimationFrame(frame)
  }
  raf = requestAnimationFrame(frame)
  return () => { if (raf) cancelAnimationFrame(raf) }
}

// Fast terminal-style readout: the paragraphs type in as one continuous
// stream, in reading order, at a fixed character rate — quick enough to
// feel like a data dump, slow enough that each line visibly builds.
const TYPE_CPS = 140
let typingRAF = null

function typeStory(idx) {
  const story = STORIES[idx]
  storyBody.innerHTML = ''
  const nodes = story.paragraphs.map((text) => {
    const p = document.createElement('p')
    storyBody.appendChild(p)
    return { el: p, full: text }
  })

  const totalLen = nodes.reduce((n, node) => n + node.full.length, 0)
  const startTime = performance.now()
  let activeIdx = nodes.length - 1

  function tick(now) {
    const charCount = Math.min(totalLen, Math.floor(((now - startTime) / 1000) * TYPE_CPS))
    let offset = 0
    let newActiveIdx = nodes.length - 1
    let foundActive = false
    nodes.forEach((node, i) => {
      const take = Math.max(0, Math.min(node.full.length, charCount - offset))
      node.el.textContent = node.full.slice(0, take)
      if (!foundActive && take < node.full.length) { newActiveIdx = i; foundActive = true }
      offset += node.full.length
    })
    if (newActiveIdx !== activeIdx) {
      nodes.forEach((node, i) => node.el.classList.toggle('typing', i === newActiveIdx))
      activeIdx = newActiveIdx
    }
    typingRAF = charCount < totalLen ? requestAnimationFrame(tick) : null
  }
  typingRAF = requestAnimationFrame(tick)
}

let storyOpen = false
let storyPanelIdx = null
const _storyCorner = new THREE.Vector3()

// Projects the clicked panel's own front-face corners to screen space so the
// white fade + text stay contained within that portal's on-screen shape,
// rather than taking over the whole viewport.
function updateStoryRect() {
  if (storyPanelIdx === null) return
  const mesh = panels[storyPanelIdx]
  mesh.updateMatrixWorld(true)
  const hw = panelW / 2, hh = panelH / 2, z = THICK / 2
  const corners = [[-hw, -hh, z], [hw, -hh, z], [hw, hh, z], [-hw, hh, z]]
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
  corners.forEach(([x, y, zz]) => {
    _storyCorner.set(x, y, zz).applyMatrix4(mesh.matrixWorld).project(camera)
    const sx = (_storyCorner.x * 0.5 + 0.5) * innerWidth
    const sy = (1 - (_storyCorner.y * 0.5 + 0.5)) * viewportH()
    minX = Math.min(minX, sx); maxX = Math.max(maxX, sx)
    minY = Math.min(minY, sy); maxY = Math.max(maxY, sy)
  })
  storyOverlay.style.left = minX + 'px'
  storyOverlay.style.top = minY + 'px'
  storyOverlay.style.width = (maxX - minX) + 'px'
  storyOverlay.style.height = (maxY - minY) + 'px'
}

let coverTitleStop = null
function openStory(idx) {
  if (storyOpen) return
  storyOpen = true
  storyPanelIdx = idx
  angVel = 0
  const story = STORIES[idx]
  setStoryBg(story.bg)
  if (coverTitleStop) coverTitleStop()
  coverTitleStop = startCoverTitleLoop(story.coverLines, story.coverTypeOpts)
  typeStory(idx)
  storyOverlay.scrollTop = 0
  updateStoryRect()
  storyOverlay.classList.add('active')
}
function closeStory() {
  storyOpen = false
  storyPanelIdx = null
  if (typingRAF) { cancelAnimationFrame(typingRAF); typingRAF = null }
  if (coverTitleStop) { coverTitleStop(); coverTitleStop = null }
  storyOverlay.classList.remove('active')
}
storyOverlay.addEventListener('click', closeStory)
window.addEventListener('keydown', (e) => { if (storyOpen && e.key === 'Escape') closeStory() })

function handlePanelClick(idx) {
  if (idx === HUM_INDEX || idx === KNIFE_INDEX || idx === ELON_INDEX) { openStory(idx); return }
  if (window !== window.top) {
    window.parent.postMessage({ type: 'portalClick', idx }, '*')
  }
}

// The ambient piano lives in the parent app (one continuous layer across
// every ring/page) — this just reports when the user is actively moving
// this ring, not the constant idle auto-rotation.
function notifyRingDrag(dragging) {
  if (window !== window.top) window.parent.postMessage({ type: 'ringDrag', dragging }, '*')
}

// ── Interaction ───────────────────────────────────────────────────────────────
const SENS = 0.005, FRICTION = 2.5, MAX_VEL = 6.0
const AUTO_SPEED = 0.0375, DRAG_THRESH = 6
const raycaster = new THREE.Raycaster()
const clickPointer = new THREE.Vector2()

let angle = 0, angVel = 0
let dragging = false, didDrag = false
let downX = 0, downY = 0, lastX = 0, lastMoveT = 0, trackedVel = 0
// Clicking a panel pauses the auto-rotation and drops the front panel's
// opacity ceiling from FRONT_OPACITY to fully opaque — the same "no longer
// transparent" focus feedback detroit_dark.html has. Dragging clears it.
let paused = false

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (isMobile || storyOpen) return
  dragging = true; didDrag = false
  downX = lastX = e.clientX; downY = e.clientY
  lastMoveT = performance.now(); trackedVel = 0
})
renderer.domElement.addEventListener('pointermove', (e) => {
  if (isMobile || !dragging) return
  const now = performance.now()
  const dx  = e.clientX - lastX
  const dtm = Math.max((now - lastMoveT) / 1000, 0.001)
  lastX = e.clientX; lastMoveT = now
  if (Math.abs(e.clientX - downX) > DRAG_THRESH || Math.abs(e.clientY - downY) > DRAG_THRESH) {
    if (!didDrag) { paused = false; notifyRingDrag(true) }
    didDrag = true
    angle += dx * SENS
    trackedVel = trackedVel * 0.6 + (dx / dtm) * 0.4
  }
})
renderer.domElement.addEventListener('pointerup', () => {
  if (isMobile || !dragging) return
  if (didDrag) notifyRingDrag(false)
  dragging = false
  if (!didDrag) {
    clickPointer.x = (downX / innerWidth) * 2 - 1
    clickPointer.y = -((downY / innerHeight) * 2 - 1)
    raycaster.setFromCamera(clickPointer, camera)
    const hits = raycaster.intersectObjects(panels, false)
    if (hits.length > 0) { paused = true; handlePanelClick(hits[0].object.userData.panelIdx) }
  } else {
    const av = (performance.now() - lastMoveT > 120) ? 0 : trackedVel * SENS
    angVel = Math.max(-MAX_VEL, Math.min(MAX_VEL, av))
  }
})

// Mobile touch — vertical swipe (ring spins on the vertical axis on mobile)
let touchId = null, touchLastY = 0, touchLastT = 0, touchVel = 0
let mobHSwiping = false, touchStartX = 0, touchStartY = 0

renderer.domElement.addEventListener('touchstart', (e) => {
  if (!isMobile || storyOpen) return
  e.preventDefault()
  const t = e.touches[0]
  touchId = t.identifier
  touchStartX = t.clientX
  touchStartY = touchLastY = t.clientY
  touchLastT = performance.now()
  touchVel = 0; mobHSwiping = false
  dragging = true
}, { passive: false })
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!isMobile) return
  e.preventDefault()
  const t = Array.from(e.touches).find(x => x.identifier === touchId)
  if (!t) return
  const now = performance.now()
  const dy  = t.clientY - touchLastY
  const dtm = Math.max((now - touchLastT) / 1000, 0.016)
  if (!mobHSwiping && Math.abs(t.clientY - touchStartY) > 8) { mobHSwiping = true; paused = false; notifyRingDrag(true) }
  if (mobHSwiping) {
    angle += dy * MOB_TOUCH_SENS
    touchVel = touchVel * 0.6 + (dy / dtm) * 0.4
  }
  touchLastY = t.clientY; touchLastT = now
}, { passive: false })
renderer.domElement.addEventListener('touchend', (e) => {
  if (!isMobile || storyOpen) return
  if (mobHSwiping) notifyRingDrag(false)
  dragging = false
  if (!mobHSwiping) {
    const t = e.changedTouches[0]
    clickPointer.x = (t.clientX / innerWidth) * 2 - 1
    clickPointer.y = -((t.clientY / viewportH()) * 2 - 1)
    raycaster.setFromCamera(clickPointer, camera)
    const hits = raycaster.intersectObjects(panels, false)
    if (hits.length > 0) { paused = true; handlePanelClick(hits[0].object.userData.panelIdx) }
  } else {
    angVel = Math.max(-MAX_VEL, Math.min(MAX_VEL, touchVel * MOB_TOUCH_SENS))
  }
  touchId = null
}, { passive: true })

// Wheel events fire continuously through a scroll gesture with no natural
// start/end like pointerdown/up — debounce so the piano gets one "started"
// per burst and one "stopped" after scrolling actually pauses.
let wheelDragTimeout = null
window.addEventListener('wheel', (e) => {
  if (storyOpen) return
  e.preventDefault()
  angle -= e.deltaY * 0.0008
  angVel = 0
  if (!wheelDragTimeout) notifyRingDrag(true)
  clearTimeout(wheelDragTimeout)
  wheelDragTimeout = setTimeout(() => { notifyRingDrag(false); wheelDragTimeout = null }, 220)
}, { passive: false })

window.addEventListener('keydown', (e) => {
  if (storyOpen) return
  if (e.key === 'ArrowLeft')       angVel = Math.min(MAX_VEL, angVel + 1.8)
  else if (e.key === 'ArrowRight') angVel = Math.max(-MAX_VEL, angVel - 1.8)
})
window.addEventListener('message', (e) => {
  if (storyOpen) return
  if (!e.data || e.data.type !== 'key') return
  if (e.data.key === 'ArrowLeft')       angVel = Math.min(MAX_VEL, angVel + 1.8)
  else if (e.data.key === 'ArrowRight') angVel = Math.max(-MAX_VEL, angVel - 1.8)
})

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / viewportH()
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, viewportH())
  updateStoryRect()
})

// ── Render loop ───────────────────────────────────────────────────────────────
let last = performance.now()

function render(now) {
  requestAnimationFrame(render)
  let dt = (now - last) / 1000; last = now
  if (dt > 0.05) dt = 0.05

  humCover.drawOverlay(now)
  siphonCover.drawOverlay(now)
  knifeCover.drawOverlay(now)
  elonCover.drawOverlay(now)

  if (!dragging && !storyOpen) {
    if (!paused) {
      const target = AUTO_SPEED
      angVel = target + (angVel - target) * Math.exp(-FRICTION * dt)
    } else {
      angVel *= Math.exp(-FRICTION * dt)
    }
    angle += angVel * dt
  }

  if (isMobile) {
    orbitEuler.set(angle, 0, 0, 'XYZ')
    orbitQuat.setFromEuler(orbitEuler)

    for (let i = 0; i < COUNT; i++) {
      orbitPos.copy(homePositions[i]).applyQuaternion(orbitQuat)
      panels[i].position.set(0, orbitPos.y * SPREAD, orbitPos.z)
      panels[i].rotation.set(Math.atan2(-orbitPos.y, orbitPos.z), 0, 0)

      const norm = Math.min(1, Math.max(0, (orbitPos.z + MOB_RADIUS) / (2 * MOB_RADIUS)))
      const cover = videoCoversByIndex[i]
      faceMats[i].opacity  = cover ? 1 : (paused ? 1 : FRONT_OPACITY * (0.5 + 0.5 * norm))
      glassMats[i].opacity = BACK_OPACITY  * (0.3 + 0.7 * norm)
      sideMats[i].opacity  = 0.65 * (0.22 + 0.45 * norm)
      backMats[i].opacity  = 0.72
      panels[i].renderOrder = Math.round(orbitPos.z * 1000)
      if (cover && cover.staticMeshRef) cover.staticMeshRef.renderOrder = panels[i].renderOrder + 1
      if (cover && cover.meshRef) cover.meshRef.renderOrder = panels[i].renderOrder + 2
    }
  } else {
    orbitEuler.set(0, angle, 0, 'XYZ')
    orbitQuat.setFromEuler(orbitEuler)

    for (let i = 0; i < COUNT; i++) {
      orbitPos.copy(homePositions[i]).applyQuaternion(orbitQuat)
      panels[i].position.set(orbitPos.x * SPREAD, 0, orbitPos.z)
      panels[i].rotation.set(0, Math.atan2(orbitPos.x, orbitPos.z), 0)

      const norm = Math.min(1, Math.max(0, (orbitPos.z + RADIUS) / (2 * RADIUS)))
      const cover = videoCoversByIndex[i]
      faceMats[i].opacity  = cover ? 1 : (paused ? 1 : FRONT_OPACITY * (0.5 + 0.5 * norm))
      glassMats[i].opacity = BACK_OPACITY  * (0.3 + 0.7 * norm)
      sideMats[i].opacity  = 0.65 * (0.22 + 0.45 * norm)
      backMats[i].opacity  = 0.72
      panels[i].renderOrder = Math.round(orbitPos.z * 1000)
      if (cover && cover.staticMeshRef) cover.staticMeshRef.renderOrder = panels[i].renderOrder + 1
      if (cover && cover.meshRef) cover.meshRef.renderOrder = panels[i].renderOrder + 2
    }
  }

  if (storyOpen) updateStoryRect()

  renderer.render(scene, camera)
}

requestAnimationFrame(render)
</script>
</body>
</html>
